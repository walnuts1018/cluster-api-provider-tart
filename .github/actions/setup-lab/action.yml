name: Setup bare-metal lab
description: |
  Tart E2E(bare-metal lab)向けに、libvirt/QEMU/dnsmasqと、既存OSS wol-libvirt-gateway
  (https://github.com/brunoproduit/wol-libvirt-gateway)をubuntu runner上へセットアップする
  複合action。checkoutは呼び出し元で実施すること。

inputs:
  wol-gateway-ref:
    description: "wol-libvirt-gatewayをbuildするgit ref(tag/branch/commit)"
    required: false
    default: "main"
  wol-gateway-install-path:
    description: "buildしたwol-libvirt-gatewayバイナリの配置先"
    required: false
    default: "/usr/local/bin/wol-libvirt-gateway"

runs:
  using: composite
  steps:
    - name: Install libvirt/QEMU/dnsmasq
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          qemu-kvm \
          qemu-utils \
          libvirt-daemon-system \
          libvirt-clients \
          libvirt-dev \
          dnsmasq-base \
          bridge-utils \
          virtinst

    - name: Grant runner user libvirt access
      shell: bash
      run: |
        set -euxo pipefail
        sudo usermod -aG kvm,libvirt "$(whoami)"
        sudo systemctl enable --now libvirtd

    - name: Verify /dev/kvm access
      shell: bash
      run: |
        set -euxo pipefail
        if [ ! -e /dev/kvm ]; then
          echo "::error::/dev/kvm is not present; this runner does not support nested virtualization (KVM required, TCG fallback is not supported)"
          exit 1
        fi
        if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
        fi
        test -r /dev/kvm && test -w /dev/kvm

    - name: Install Rust toolchain for building wol-libvirt-gateway
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Build wol-libvirt-gateway
      shell: bash
      run: |
        set -euxo pipefail
        cargo install --git https://github.com/brunoproduit/wol-libvirt-gateway \
          --rev "${{ inputs.wol-gateway-ref }}" \
          --root /tmp/wol-libvirt-gateway-install \
          --locked || \
        cargo install --git https://github.com/brunoproduit/wol-libvirt-gateway \
          --rev "${{ inputs.wol-gateway-ref }}" \
          --root /tmp/wol-libvirt-gateway-install
        sudo install -m 0755 /tmp/wol-libvirt-gateway-install/bin/wol-libvirt-gateway "${{ inputs.wol-gateway-install-path }}"
      # TODO: wol-libvirt-gatewayのcrate名/binary名がリポジトリの実際のCargo.tomlと異なる場合、
      # `cargo install --git`が生成するbinary名を実際のリポジトリ構成に合わせて調整する必要がある。
      # 現時点ではリポジトリ内容を直接確認できていないため、実CI実行時に検証・修正する。
