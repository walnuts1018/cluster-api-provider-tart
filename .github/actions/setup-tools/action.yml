name: Setup Tools and Go Cache
description: |
  mise によるツールセットアップと Go モジュールキャッシュの設定を行う共通 Action。
  checkout は呼び出し元で実施すること。

inputs:
  go-cache:
    description: "Go モジュールキャッシュを有効化するか"
    required: false
    default: "true"
  golangci-lint-cache:
    description: "golangci-lint キャッシュも含めるか"
    required: false
    default: "false"
  install-args:
    description: "miseでインストールするツールをスペース区切りで指定する"
    required: true

runs:
  using: composite
  steps:
    - name: Go module cache
      if: inputs.go-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/go/pkg/mod
          .cache/go-build
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: golangci-lint の解析キャッシュ
      if: inputs.golangci-lint-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml', '.custom-gcl.yml') }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-

    # module plugin を含むバイナリは完全一致時だけ再利用する。
    - name: カスタム golangci-lint バイナリのキャッシュ
      if: inputs.golangci-lint-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: bin/custom-gcl
        key: custom-golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml', '.golangci.yml', '.custom-gcl.yml') }}

    - name: Setup tools
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        install_args: ${{ inputs.install-args }}

    - name: Disable mise auto-install for subsequent steps
      shell: bash
      run: echo "MISE_AUTO_INSTALL=false" >> "$GITHUB_ENV"
