name: Setup Tools and Go Cache
description: |
  mise によるツールセットアップと Go モジュールキャッシュの設定を行う共通 Action。
  checkout は呼び出し元で実施すること。

inputs:
  go-cache:
    description: "Go モジュールキャッシュを有効化するか"
    required: false
    default: "true"
  golangci-lint-cache:
    description: "golangci-lint キャッシュも含めるか"
    required: false
    default: "false"
  install-args:
    description: "miseでインストールするツールをスペース区切りで指定する"
    required: true

runs:
  using: composite
  steps:
    - name: Setup tools
      uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      with:
        install_args: ${{ inputs.install-args }}

    - name: Go module cache
      if: inputs.go-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/go/pkg/mod
          .cache/go-build
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    # golangci-lint キャッシュは golangci-lint-cache が true の場合のみキャッシュする
    - name: golangci-lint cache
      if: inputs.golangci-lint-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml', '.custom-gcl.yml') }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-
