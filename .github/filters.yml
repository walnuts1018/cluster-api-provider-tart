# dorny/paths-filter 用パスフィルター定義

# Goコード、生成物、ビルド、CIに関連するパス。
go:
  - ".github/workflows/ci.yaml"
  - ".github/actions/**"
  - "api/**"
  - "cmd/**"
  - "config/**"
  - "domain/**"
  - "dto/**"
  - "infrastructure/**"
  - "utils/**"
  - "test/**"
  - "mise.toml"
  - "go.mod"
  - "go.sum"
  - "Dockerfile*"
  - "Makefile"
  - "hack/boilerplate.go.txt"
  - "artifact/**"
  - ".github/workflows/**"
  - ".github/filters.yml"
  - "renovate.json5"

# lint設定だけが変わった場合にもlintを実行する。
lint_config:
  - ".golangci.yml"
  - ".custom-gcl.yml"
