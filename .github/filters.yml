# dorny/paths-filter 用パスフィルター定義
# YAMLアンカーを使用して共通パスの重複を排除する

# go コードに関連するパス（アンカーで再利用）
.go-paths: &go-paths
  - ".github/workflows/ci.yaml"
  - ".github/actions/**"
  - "api/**"
  - "cmd/**"
  - "config/**"
  - "internal/**"
  - "pkg/**"
  - "test/**"
  - "mise.toml"
  - "go.mod"
  - "go.sum"
  - "Dockerfile*"
  - "Makefile"
  - "hack/**"
  - "artifact/**"
  - ".github/workflows/**"
  - ".github/filters.yml"
  - "renovate.json5"

go: *go-paths

# lint設定だけが変わった場合にもlintを実行する。
lint_config:
  - ".golangci.yml"
  - ".custom-gcl.yml"
