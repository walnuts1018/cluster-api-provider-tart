name: Provisioning Agent Artifact

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/agent-artifact.yaml
      - mise.toml
      - cmd/efi-commit/**
      - cmd/provisioning-agent/**
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable OCI tag for the Agent Artifact.
        required: true
        type: string
        default: dev

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-provisioning-agent

jobs:
  verify:
    name: Verify provisioning Agent initramfs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go

      - name: Install Agent Artifact inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static cpio kmod linux-image-generic systemd-boot

      - name: Build and verify Agent initramfs
        env:
          AGENT_KERNEL: /tmp/tart-agent-vmlinuz
          AGENT_INITRD: /tmp/tart-agent-initrd
          AGENT_ARTIFACT_OVERLAY_INITRD: /tmp/tart-agent-overlay.initrd
          SYSTEMD_BOOT_EFI: /usr/lib/systemd/boot/efi/systemd-bootx64.efi
          AGENT_ARTIFACT_OUTPUT_DIR: dist/agent-artifact
        run: |
          kernel_path="$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -print | sort | tail -n 1)"
          initrd_path="$(find /boot -maxdepth 1 -type f -name 'initrd.img-*' -print | sort | tail -n 1)"
          test -n "$kernel_path" -a -n "$initrd_path"
          sudo install -m 0644 "$kernel_path" /tmp/tart-agent-vmlinuz
          sudo install -m 0644 "$initrd_path" /tmp/tart-agent-initrd
          export AGENT_KERNEL_RELEASE="${kernel_path##*/vmlinuz-}"
          mise run agent-artifact-build-real
          gzip -dc /tmp/tart-agent-overlay.initrd > /tmp/tart-agent-overlay.cpio
          cpio -it < /tmp/tart-agent-overlay.cpio > /tmp/tart-agent-initramfs-files
          grep -Fx 'etc/tart/agent-modules' /tmp/tart-agent-initramfs-files
          grep -F 'drivers/net/ethernet/intel/e1000e/' /tmp/tart-agent-initramfs-files
          grep -F 'drivers/nvme/host/nvme' /tmp/tart-agent-initramfs-files

  build:
    name: Build and publish the provisioning Agent Artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go

      - name: Install Agent Artifact inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static cpio kmod linux-image-generic systemd-boot

      - name: Prepare signing keys
        id: keys
        env:
          AGENT_ARTIFACT_SIGNING_KEY: ${{ secrets.AGENT_ARTIFACT_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$AGENT_ARTIFACT_SIGNING_KEY"
          printf '%s' "$AGENT_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/agent-artifact-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/agent-artifact-signing-key.pem" -pubout -out "$RUNNER_TEMP/agent-artifact-public.pem"

      - name: Build Agent initramfs
        env:
          AGENT_KERNEL: /tmp/tart-agent-vmlinuz
          AGENT_INITRD: /tmp/tart-agent-initrd
          AGENT_ARTIFACT_OVERLAY_INITRD: /tmp/tart-agent-overlay.initrd
          SYSTEMD_BOOT_EFI: /usr/lib/systemd/boot/efi/systemd-bootx64.efi
          AGENT_ARTIFACT_OUTPUT_DIR: dist/agent-artifact
        run: |
          kernel_path="$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -print | sort | tail -n 1)"
          initrd_path="$(find /boot -maxdepth 1 -type f -name 'initrd.img-*' -print | sort | tail -n 1)"
          test -n "$kernel_path" -a -n "$initrd_path"
          sudo install -m 0644 "$kernel_path" /tmp/tart-agent-vmlinuz
          sudo install -m 0644 "$initrd_path" /tmp/tart-agent-initrd
          export AGENT_KERNEL_RELEASE="${kernel_path##*/vmlinuz-}"
          mise run agent-artifact-build-real

      - name: Verify Agent initramfs hardware support
        run: |
          gzip -dc /tmp/tart-agent-overlay.initrd > /tmp/tart-agent-overlay.cpio
          cpio -it < /tmp/tart-agent-overlay.cpio > /tmp/tart-agent-initramfs-files
          grep -Fx 'etc/tart/agent-modules' /tmp/tart-agent-initramfs-files
          grep -F 'drivers/net/ethernet/intel/e1000e/' /tmp/tart-agent-initramfs-files
          grep -F 'drivers/nvme/host/nvme' /tmp/tart-agent-initramfs-files

      - name: Create Agent Artifact manifest and publish OCI payload
        id: publish
        env:
          AGENT_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          AGENT_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$AGENT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [ "$AGENT_TAG" != latest ]
          payload_digest=$(go run ./cmd/artifacter -dir dist/agent-artifact -repo "$AGENT_REPOSITORY" -tag "$AGENT_TAG-payload")
          reference="oci://$AGENT_REPOSITORY@$payload_digest"
          AGENT_ARTIFACT_REFERENCE="$reference" \
          AGENT_ARTIFACT_KERNEL=dist/agent-artifact/vmlinuz \
          AGENT_ARTIFACT_INITRD=dist/agent-artifact/initrd \
          AGENT_ARTIFACT_SIGNING_KEY="$RUNNER_TEMP/agent-artifact-signing-key.pem" \
          AGENT_ARTIFACT_SIGNING_KEY_ID=release-agent-v1 \
          AGENT_ARTIFACT_OUTPUT_DIR=dist/agent-artifact \
            mise run agent-artifact-manifest
          cp dist/agent-artifact/manifest.json dist/agent-artifact/manifest.signature.json "$RUNNER_TEMP/"
          go run ./cmd/artifacter -dir dist/agent-artifact -repo "$AGENT_REPOSITORY" -tag "$AGENT_TAG"
          printf 'AGENT_ARTIFACT_REFERENCE=%s\n' "$reference" > dist/agent-artifact/references.env
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Upload Agent Artifact release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/agent-artifact/manifest.json
            dist/agent-artifact/manifest.signature.json
            dist/agent-artifact/references.env
            dist/agent-artifact/vmlinuz
            dist/agent-artifact/initrd
            ${{ runner.temp }}/agent-artifact-public.pem
