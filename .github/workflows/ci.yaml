name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更ファイルを検出する
    runs-on: ubuntu-slim
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lint: ${{ steps.filter.outputs.lint }}
      release-docs: ${{ steps.filter.outputs.release-docs }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            go:
              - ".github/workflows/ci.yaml"
              - ".github/actions/**"
              - "api/**"
              - "cmd/**"
              - "config/**"
              - "internal/**"
              - "pkg/**"
              - "test/**"
              - "mise.toml"
              - "go.mod"
              - "go.sum"
            lint:
              - ".github/workflows/ci.yaml"
              - ".github/actions/**"
              - "api/**"
              - "cmd/**"
              - "config/**"
              - "internal/**"
              - "pkg/**"
              - "test/**"
              - "mise.toml"
              - "go.mod"
              - "go.sum"
              - ".golangci.yml"
              - ".custom-gcl.yml"
            release-docs:
              - ".github/workflows/ci.yaml"
              - ".github/actions/**"
              - "hack/**"
              - "mise.toml"
              - "go.mod"
              - "go.sum"

  generate:
    name: generateで差分があったら落とす
    runs-on: ubuntu-slim
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "false"

      - name: generate
        run: mise run generate

      - name: diff があったら落とす
        run: git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lint == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          golangci-lint-cache: "true"

      - name: Lint
        run: mise ci-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Running Test
        run: mise run ci-test

  test-build:
    name: build check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: build
        run: mise run ci-build

  validate-release-docs:
    name: validate release docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.release-docs == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Validate release docs
        run: mise run validate-release-docs

  status-check:
    name: CI status check
    runs-on: ubuntu-slim
    needs: [changes, generate, lint, test, test-build, validate-release-docs]
    # always() で必ず実行し、実行されたジョブの中に失敗があれば落とす
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          failed = [
            name for name, job in needs.items()
            if job['result'] not in ('success', 'skipped')
          ]
          if failed:
            print('Failed jobs:', failed)
            sys.exit(1)
          print('All jobs passed or skipped.')
          "
