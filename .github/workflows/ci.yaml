name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更ファイルを検出する
    runs-on: ubuntu-slim
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lint_config: ${{ steps.filter.outputs.lint_config }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: .github/filters.yml

  generate:
    name: 生成物を検証する
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen

      - name: Generate manifests and Go code
        run: |
          mise run manifests
          mise run generate

      - name: 生成物の差分を検出する
        run: git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.lint_config == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          golangci-lint-cache: "true"
          install-args: go golangci-lint actionlint shellcheck

      - name: Run lint
        run: mise run ci-lint

  test:
    name: Go Test
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go jq go:sigs.k8s.io/controller-runtime/tools/setup-envtest

      - name: Run tests
        run: mise run ci-test

  build:
    name: Build check
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go

      - name: Build binaries
        run: mise run ci-build

  status:
    name: CI status
    runs-on: ubuntu-slim
    needs: [changes, generate, lint, test, build]
    if: always()
    steps:
      - name: Check all executed jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >
          echo "$RESULTS" | jq -e
          'to_entries | map(select(.value.result | IN("success", "skipped") | not)) |
          if length == 0 then "All executed jobs passed." else
          "Failed jobs: " + (map(.key) | join(", ")) | halt_error(1) end'
