name: CI
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yaml"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "test/**"
      - "mise.toml"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".custom-gcl.yml"
  pull_request:
    paths:
      - ".github/workflows/ci.yaml"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "test/**"
      - "mise.toml"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".custom-gcl.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: generateで差分があったら落とす
    runs-on: ubuntu-slim
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: generate
        run: |
          mise run generate

      - name: diff があったら落とす
        run: git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go/pkg/mod
            .cache/go-build
            .cache/golangci-lint
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Lint
        run: mise ci-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go/pkg/mod
            .cache/go-build
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Running Test
        run: mise run ci-test

  test-build:
    name: build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/go/pkg/mod
            .cache/go-build
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: build
        run: mise run ci-build

  validate-release-docs:
    name: validate release docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Validate release docs
        run: mise run validate-release-docs

  status-check:
    runs-on: ubuntu-slim
    needs: [generate, lint, test, test-build, validate-release-docs]
    if: failure()
    steps:
      - run: exit 1
