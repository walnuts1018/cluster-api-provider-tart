name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Validate generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/kustomize/kustomize/v5

      - name: Generate Go code
        run: mise run generate

      - name: Generate manifests
        run: mise run manifests

      - name: Check generated diff
        run: git diff --exit-code

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          golangci-lint-cache: "true"
          install-args: go golangci-lint ghalint

      # build/build-netboot-server/vet/lint/lint-actions/testは互いに依存せず、同一runner上で並列実行できる。
      - parallel:
          - name: Build
            run: mise run build
          - name: Build netboot-server
            run: mise run build-netboot-server
          - name: Vet
            run: mise run vet
          - name: Lint
            run: mise run lint
          - name: Lint GitHub Actions
            run: mise run lint-actions
          - name: Test
            run: mise run test

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yaml
    permissions:
      contents: read

  status:
    name: Status Check
    runs-on: ubuntu-slim
    needs: [generate, static, e2e]
    if: failure() || cancelled()
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: exit 1
