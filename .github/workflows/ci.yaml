name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更ファイルを検出する
    runs-on: ubuntu-slim
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lint_config: ${{ steps.filter.outputs.lint_config }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: .github/filters.yml

  generate:
    name: 生成物に差分があったら落とす
    runs-on: ubuntu-slim
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen

      - name: Generate manifests and Go code
        run: |
          mise run manifests
          mise run generate

      - name: diff があったら落とす
        run: git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.lint_config == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          golangci-lint-cache: "true"
          install-args: go golangci-lint actionlint shellcheck

      - name: Lint
        run: mise ci-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go jq go:sigs.k8s.io/controller-runtime/tools/setup-envtest

      - name: Running Test
        run: mise run ci-test

  test-build:
    name: build check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go

      - name: build
        run: mise run ci-build

  test-e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen kind

      - name: Running Test e2e
        run: mise run test-e2e

  status-check:
    name: CI status check
    runs-on: ubuntu-slim
    needs: [changes, generate, lint, test, test-build, test-e2e]
    # always() で必ず実行し、実行されたジョブの中に失敗があれば落とす
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e '
            to_entries
            | map(select(.value.result | IN("success", "skipped") | not))
            | if length > 0 then
                "Failed jobs: " + (map(.key) | tostring) | halt_error(1)
              else
                "All jobs passed or skipped."
              end
          '
