name: E2E (bare-metal lab)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-bare-metal:
    name: FreshProvision / InPlaceUpgrade / ReconcileRecovery
    # KVM/nested virtualizationが必要であり、実行時間も長いため、通常PRのfast feedbackを
    # 阻害しない独立したworkflowとして実行する(ci.yamlとは分離)。
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          install-args: go rust kind kubectl kustomize clusterctl

      - name: Verify /dev/kvm access
        run: |
          set -euxo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present; this runner does not support nested virtualization (KVM required, TCG fallback is not supported)"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install libvirt/QEMU/dnsmasq
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-kvm \
            qemu-utils \
            libvirt-daemon-system \
            libvirt-clients \
            libvirt-dev \
            dnsmasq-base \
            bridge-utils \
            virtinst

      - name: Grant runner user libvirt access
        run: |
          set -euxo pipefail
          sudo usermod -aG kvm,libvirt "$(whoami)"
          # QEMUは既定でdynamic ownershipの専用非特権ユーザーとして実行されるが、disk image
          # (runner.temp配下)までのディレクトリ階層(/home/runner等)をtraverseできず
          # Permission deniedになる。使い捨てのCI VMでありtenant分離は不要なため、rootで
          # 実行させて権限問題を回避する。
          echo 'user = "root"' | sudo tee -a /etc/libvirt/qemu.conf
          echo 'group = "root"' | sudo tee -a /etc/libvirt/qemu.conf
          sudo systemctl enable --now libvirtd
          sudo systemctl restart libvirtd

      - name: Build wol-libvirt-gateway
        run: |
          set -euxo pipefail
          mise run build-wol-gateway
          sudo install -m 0755 .cache/wol-libvirt-gateway/bin/wol-libvirt-gateway /usr/local/bin/wol-libvirt-gateway
          # WoL magic packetの標準宛先port 9はwell-known/privileged portであり、非rootプロセスは
          # CAP_NET_BIND_SERVICEなしにbindできない。gatewayをroot権限なしで起動するためcapabilityを付与する。
          sudo setcap 'cap_net_bind_service=+ep' /usr/local/bin/wol-libvirt-gateway

      - name: Build controller-manager images
        # imageの名前はconfig/manager/*/manager.yaml(およびconfig/netboot-server)が参照する
        # placeholder名(infrastructure-controller等)と一致させる。tagのみをe2eへ置き換えて
        # framework.InstallTartProvidersのkustomize images overrideと対応させる。
        run: |
          set -euxo pipefail
          docker build --target bootstrap-manager -t bootstrap-controller:e2e .
          docker build --target control-plane-manager -t control-plane-controller:e2e .
          docker build --target infrastructure-manager -t infrastructure-controller:e2e .
          docker build --target netboot-server -t netboot-server:e2e .

      - name: Run E2E suite (kind + CAPI + Tart provider + bare-metal lab)
        env:
          KUBECONFIG: ${{ runner.temp }}/tart-e2e-kubeconfig
          KIND_CLUSTER: tart-e2e
          TART_E2E_ARTIFACT_DIR: ${{ github.workspace }}/_artifacts/e2e
          TART_E2E_LAB_WORKDIR: ${{ runner.temp }}/tart-e2e-lab
          TART_E2E_WOL_GATEWAY_BINARY: /usr/local/bin/wol-libvirt-gateway
          TART_E2E_PROVIDER_IMAGE_TAG: e2e
        # netboot-server(ProxyDHCP)はDHCP well-known port 67へbindする必要があり、非rootでは
        # permission deniedになる。libvirtソケットアクセスも合わせ、テストプロセス全体をroot
        # 権限で実行する(sudo -Eで環境変数を引き継ぎ、PATHはsecure_path対策で明示的に指定する)。
        run: sudo -E env "PATH=$PATH" mise run test-e2e

      - name: Dump cluster/lab state
        if: always()
        env:
          KUBECONFIG: ${{ runner.temp }}/tart-e2e-kubeconfig
        run: |
          set +e
          mkdir -p _artifacts/e2e/workflow-level
          kubectl get all --all-namespaces -o wide > _artifacts/e2e/workflow-level/all-resources.txt 2>&1
          sudo virsh --connect qemu:///system list --all > _artifacts/e2e/workflow-level/virsh-list.txt 2>&1
          exit 0

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tart-e2e-artifacts
          path: _artifacts/e2e
          if-no-files-found: ignore
          retention-days: 14
