name: E2E (bare-metal lab)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-bare-metal:
    name: FreshProvision / InPlaceUpgrade / ReconcileRecovery
    # KVM/nested virtualizationが必要であり、実行時間も長いため、通常PRのfast feedbackを
    # 阻害しない独立したworkflowとして実行する(ci.yamlとは分離)。
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "true"
          install-args: go rust kind kubectl kustomize

      - name: Verify /dev/kvm access
        run: |
          set -euxo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present; this runner does not support nested virtualization (KVM required, TCG fallback is not supported)"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm

      - name: Install libvirt/QEMU/dnsmasq
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-kvm \
            qemu-utils \
            libvirt-daemon-system \
            libvirt-clients \
            libvirt-dev \
            dnsmasq-base \
            bridge-utils \
            virtinst

      - name: Grant runner user libvirt access
        run: |
          set -euxo pipefail
          sudo usermod -aG kvm,libvirt "$(whoami)"
          sudo systemctl enable --now libvirtd

      - name: Build wol-libvirt-gateway
        run: |
          set -euxo pipefail
          mise run build-wol-gateway
          sudo install -m 0755 .cache/wol-libvirt-gateway/bin/wol-libvirt-gateway /usr/local/bin/wol-libvirt-gateway
        # TODO: wol-libvirt-gatewayのcrate名/binary名がリポジトリの実際のCargo.tomlと異なる場合、
        # `cargo install --git`が生成するbinary名を実際のリポジトリ構成に合わせて調整する必要がある。
        # 現時点ではリポジトリ内容を直接確認できていないため、実CI実行時に検証・修正する。

      - name: Build controller-manager images
        run: |
          set -euxo pipefail
          docker build --target bootstrap-manager -t localhost/tart/bootstrap-manager:e2e .
          docker build --target control-plane-manager -t localhost/tart/control-plane-manager:e2e .
          docker build --target infrastructure-manager -t localhost/tart/infrastructure-manager:e2e .

      - name: Run E2E suite (kind + CAPI + Tart provider + bare-metal lab)
        env:
          KUBECONFIG: ${{ runner.temp }}/tart-e2e-kubeconfig
          TART_E2E_ARTIFACT_DIR: ${{ github.workspace }}/_artifacts/e2e
          TART_E2E_LAB_WORKDIR: ${{ runner.temp }}/tart-e2e-lab
          TART_E2E_WOL_GATEWAY_BINARY: /usr/local/bin/wol-libvirt-gateway
        run: mise run test-e2e

      - name: Dump cluster/lab state
        if: always()
        run: |
          set +e
          mkdir -p _artifacts/e2e/workflow-level
          kubectl get all --all-namespaces -o wide > _artifacts/e2e/workflow-level/all-resources.txt 2>&1
          sudo virsh --connect qemu:///system list --all > _artifacts/e2e/workflow-level/virsh-list.txt 2>&1
          exit 0

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tart-e2e-artifacts
          path: _artifacts/e2e
          if-no-files-found: ignore
          retention-days: 14
