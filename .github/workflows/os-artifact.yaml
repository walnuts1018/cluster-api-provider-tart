name: OS Artifact

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifact to GHCR.
        required: true
        type: boolean
        default: false
      image_tag:
        description: Immutable build tag used when publishing.
        required: true
        type: string
        default: dev
  pull_request:
    paths:
      - ".github/workflows/os-artifact.yaml"
      - "artifact/locks/**"
      - "artifact/mkosi/**"
      - "cmd/provisioning-agent/**"
      - "docs/redesign/ci-verification.md"
      - "docs/redesign/tasks/01-foundation-spikes.md"
      - "docs/redesign/tasks/11-compatibility-and-release.md"
      - "hack/boot-trial-rollback-sim/**"
      - "hack/os-artifact-evidence-summary/**"
      - "hack/os-firstboot-qemu/**"
      - "hack/artifact-manifest/**"
      - "hack/artifact-provenance/**"
      - "internal/adapter/k8s/bootreport/**"
      - "internal/application/inplaceupdate/**"
      - "internal/domain/bootreport/**"
      - "internal/domain/inplaceupdate/**"
      - "internal/provisioningagent/**"
      - "mise.toml"
      - "go.mod"
      - "go.sum"
      - "pkg/agentprotocol/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/os-artifact.yaml"
      - "artifact/locks/**"
      - "artifact/mkosi/**"
      - "cmd/provisioning-agent/**"
      - "docs/redesign/ci-verification.md"
      - "docs/redesign/tasks/01-foundation-spikes.md"
      - "docs/redesign/tasks/11-compatibility-and-release.md"
      - "hack/boot-trial-rollback-sim/**"
      - "hack/os-artifact-evidence-summary/**"
      - "hack/os-firstboot-qemu/**"
      - "hack/artifact-manifest/**"
      - "hack/artifact-provenance/**"
      - "internal/adapter/k8s/bootreport/**"
      - "internal/application/inplaceupdate/**"
      - "internal/domain/bootreport/**"
      - "internal/domain/inplaceupdate/**"
      - "internal/provisioningagent/**"
      - "mise.toml"
      - "go.mod"
      - "go.sum"
      - "pkg/agentprotocol/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-config-contract:
    name: Artifact config contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ubuntu-24.04-amd64-kubeadm
            config: artifact/config/ubuntu-24.04-amd64.json
          - key: ubuntu-24.04-amd64-k3s
            config: artifact/config/ubuntu-24.04-amd64-k3s.json
          - key: ubuntu-24.04-amd64-k0s
            config: artifact/config/ubuntu-24.04-amd64-k0s.json
          - key: ubuntu-26.04-amd64-kubeadm
            config: artifact/config/ubuntu-26.04-amd64-kubeadm.json
          - key: ubuntu-26.04-amd64-k3s
            config: artifact/config/ubuntu-26.04-amd64-k3s.json
          - key: ubuntu-26.04-amd64-k0s
            config: artifact/config/ubuntu-26.04-amd64-k0s.json
          - key: debian-13-amd64-kubeadm
            config: artifact/config/debian-13-amd64-kubeadm.json
          - key: debian-13-amd64-k3s
            config: artifact/config/debian-13-amd64-k3s.json
          - key: debian-13-amd64-k0s
            config: artifact/config/debian-13-amd64-k0s.json
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Verify ${{ matrix.key }} manifest config
        run: go test ./hack/artifact-manifest ./pkg/artifact ./pkg/platformprofile

  ubuntu-24-04-amd64:
    name: Ubuntu 24.04 amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Setup mkosi
        uses: systemd/mkosi@84af20892b61c8e177e391f997ded8b4cb5514f2 # v26

      - name: Install OS artifact verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils e2fsprogs python3-pefile systemd-boot cryptsetup-bin dosfstools ovmf

      - name: Build OS and Verity payloads
        run: mise run artifact-build-mkosi

      - name: Verify dm-verity detects OS payload tampering
        env:
          ARTIFACT_VERITY_WORK_DIR: dist/os-artifact/dm-verity
        run: mise run artifact-test-dm-verity

      - name: Verify boot trial rollback simulator evidence
        env:
          ARTIFACT_BOOT_TRIAL_WORK_DIR: dist/os-artifact/boot-trial-rollback
        run: mise run artifact-test-boot-trial-rollback

      - name: Verify boot metadata persistence after forced power loss
        env:
          ARTIFACT_QEMU_CPU: qemu64
          ARTIFACT_QEMU_TIMEOUT: 10m
          ARTIFACT_BOOTMETA_QEMU_WORK_DIR: dist/os-artifact/boot-trial-metadata-persistence
        run: mise run artifact-test-boot-trial-metadata-persistence

      - name: Verify bootloader rollback after three failed target boots
        env:
          ARTIFACT_QEMU_CPU: qemu64
          ARTIFACT_QEMU_TIMEOUT: 10m
          ARTIFACT_BOOTLOADER_QEMU_WORK_DIR: ${{ runner.temp }}/os-artifact/bootloader-rollback
        run: mise run artifact-test-bootloader-rollback

      - name: Boot OS artifact and verify first boot report
        env:
          ARTIFACT_QEMU_CPU: qemu64
          ARTIFACT_QEMU_TIMEOUT: 10m
          ARTIFACT_QEMU_WORK_DIR: dist/os-artifact/qemu-firstboot
        run: mise run artifact-test-firstboot-qemu

      - name: Generate OS Artifact evidence summary
        if: always()
        run: >
          go run ./hack/os-artifact-evidence-summary
          --artifact-dir dist/os-artifact
          --markdown-out dist/os-artifact/evidence-summary.md
          --json-out dist/os-artifact/evidence-summary.json

      - name: Upload QEMU verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-24.04-amd64-qemu-evidence
          path: |
            dist/os-artifact/qemu-firstboot/evidence.json
            dist/os-artifact/qemu-firstboot/serial.log
            dist/os-artifact/boot-trial-metadata-persistence/evidence.json
            dist/os-artifact/boot-trial-metadata-persistence/serial-boot1.log
            dist/os-artifact/boot-trial-metadata-persistence/serial-boot2.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/evidence.json
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot1.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot2.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot3.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot4.log
            dist/os-artifact/boot-trial-rollback/evidence.json
            dist/os-artifact/boot-trial-rollback/summary.txt
            dist/os-artifact/evidence-summary.md
            dist/os-artifact/evidence-summary.json
            dist/os-artifact/dm-verity/root-hash.txt
            dist/os-artifact/dm-verity/digests-before.txt
            dist/os-artifact/dm-verity/digests-after.txt
            dist/os-artifact/dm-verity/verify-before.log
            dist/os-artifact/dm-verity/verify-after.log
          if-no-files-found: warn

      - name: Prepare signing key
        id: signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.OS_ARTIFACT_SIGNING_KEY }}
        run: |
          umask 077
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/os-artifact-signing-key.pem"
            echo "key-id=release-v1" >> "$GITHUB_OUTPUT"
          else
            openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/os-artifact-signing-key.pem"
            echo "key-id=github-actions-ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate signed Artifact Manifest
        env:
          ARTIFACT_IMAGE: dist/os-artifact/os.img
          ARTIFACT_VERITY: dist/os-artifact/os.verity
          ARTIFACT_KERNEL: dist/os-artifact/vmlinuz
          ARTIFACT_INITRD: dist/os-artifact/initrd
          ARTIFACT_SIGNING_KEY: ${{ runner.temp }}/os-artifact-signing-key.pem
          ARTIFACT_SIGNING_KEY_ID: ${{ steps.signing.outputs.key-id }}
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
        run: |
          ARTIFACT_VERITY_ROOT_HASH="$(tr -d '\n' < dist/os-artifact/verity-root-hash)"
          export ARTIFACT_VERITY_ROOT_HASH
          mise run artifact-manifest

      - name: Generate provenance
        env:
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
          ARTIFACT_SOURCE_URI: https://github.com/${{ github.repository }}
          ARTIFACT_SOURCE_REVISION: ${{ github.sha }}
          ARTIFACT_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: mise run artifact-provenance

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-24.04-amd64-os-artifact
          path: |
            dist/os-artifact/manifest.json
            dist/os-artifact/manifest.signature.json
            dist/os-artifact/sbom.cdx.json
            dist/os-artifact/provenance.intoto.json
            dist/os-artifact/packages.json
            dist/os-artifact/verity-root-hash
            dist/os-artifact/dm-verity/root-hash.txt
            dist/os-artifact/dm-verity/digests-before.txt
            dist/os-artifact/dm-verity/digests-after.txt
            dist/os-artifact/dm-verity/verify-before.log
            dist/os-artifact/dm-verity/verify-after.log
            dist/os-artifact/boot-trial-metadata-persistence/evidence.json
            dist/os-artifact/boot-trial-metadata-persistence/serial-boot1.log
            dist/os-artifact/boot-trial-metadata-persistence/serial-boot2.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/evidence.json
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot1.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot2.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot3.log
            ${{ runner.temp }}/os-artifact/bootloader-rollback/serial-boot4.log
            dist/os-artifact/boot-trial-rollback/evidence.json
            dist/os-artifact/boot-trial-rollback/summary.txt
            dist/os-artifact/qemu-firstboot/evidence.json
            dist/os-artifact/qemu-firstboot/serial.log
            dist/os-artifact/evidence-summary.md
            dist/os-artifact/evidence-summary.json
          if-no-files-found: error

      - name: Publish OCI Artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          ARTIFACT_REPOSITORY: ghcr.io/${{ github.repository }}-os-ubuntu-24.04-amd64
          ARTIFACT_TAG: ${{ inputs.image_tag }}
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
          ARTIFACT_IMAGE: dist/os-artifact/os.img
          ARTIFACT_VERITY: dist/os-artifact/os.verity
          ARTIFACT_KERNEL: dist/os-artifact/vmlinuz
          ARTIFACT_INITRD: dist/os-artifact/initrd
          ARTIFACT_SBOM: dist/os-artifact/sbom.cdx.json
          ARTIFACT_PROVENANCE: dist/os-artifact/provenance.intoto.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run artifact-push
