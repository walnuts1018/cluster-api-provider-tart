name: Release Artifacts

on:
  workflow_call:
    inputs:
      revision:
        description: コミットSHA
        required: true
        type: string
      release_tag:
        description: 公開するrelease tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$REVISION" != "$WORKFLOW_SHA" ]]; then
            echo "::error::revision (${REVISION}) must match github.sha (${WORKFLOW_SHA})"
            exit 1
          fi

  docker:
    name: Build Docker Images (${{ matrix.arch.key }})
    needs: validate
    permissions:
      contents: read
      packages: write

    runs-on: ${{ matrix.arch.os }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - key: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - key: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Docker Bake
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REVISION: ${{ inputs.revision }}
          ARCH_KEY: ${{ matrix.arch.key }}
          PLATFORM: ${{ matrix.arch.platform }}
        with:
          source: .
          builder: ${{ steps.setup-buildx.outputs.name }}
          files: docker-bake.release.hcl
          targets: default
          # 最終multi-arch indexにGitHub Artifact Attestationを付けるので、platformごとのBuildKit provenanceは生成しない。
          provenance: false

      - name: Record image digests
        shell: bash
        env:
          BOOTSTRAP_MANAGER_DIGEST: ${{ fromJSON(steps.bake.outputs.metadata)['bootstrap-manager']['containerimage.digest'] }}
          CONTROL_PLANE_MANAGER_DIGEST: ${{ fromJSON(steps.bake.outputs.metadata)['control-plane-manager']['containerimage.digest'] }}
          INFRASTRUCTURE_MANAGER_DIGEST: ${{ fromJSON(steps.bake.outputs.metadata)['infrastructure-manager']['containerimage.digest'] }}
          NETBOOT_SERVER_DIGEST: ${{ fromJSON(steps.bake.outputs.metadata)['netboot-server']['containerimage.digest'] }}
        run: |
          set -euo pipefail

          [[ "$BOOTSTRAP_MANAGER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTROL_PLANE_MANAGER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$INFRASTRUCTURE_MANAGER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$NETBOOT_SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          mkdir -p \
            "${RUNNER_TEMP}/digests/bootstrap-manager" \
            "${RUNNER_TEMP}/digests/control-plane-manager" \
            "${RUNNER_TEMP}/digests/infrastructure-manager" \
            "${RUNNER_TEMP}/digests/netboot-server"

          : > "${RUNNER_TEMP}/digests/bootstrap-manager/${BOOTSTRAP_MANAGER_DIGEST#sha256:}"
          : > "${RUNNER_TEMP}/digests/control-plane-manager/${CONTROL_PLANE_MANAGER_DIGEST#sha256:}"
          : > "${RUNNER_TEMP}/digests/infrastructure-manager/${INFRASTRUCTURE_MANAGER_DIGEST#sha256:}"
          : > "${RUNNER_TEMP}/digests/netboot-server/${NETBOOT_SERVER_DIGEST#sha256:}"

      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch.key }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Docker Images
    runs-on: ubuntu-24.04
    needs: docker
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      bootstrap_manager_image: ${{ steps.publish.outputs.bootstrap_manager_image }}
      control_plane_manager_image: ${{ steps.publish.outputs.control_plane_manager_image }}
      infrastructure_manager_image: ${{ steps.publish.outputs.infrastructure_manager_image }}
      netboot_server_image: ${{ steps.publish.outputs.netboot_server_image }}
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        id: publish
        shell: bash
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          for target in bootstrap-manager control-plane-manager infrastructure-manager netboot-server; do
            image="${REGISTRY}/${REPOSITORY}/${target}"
            dir="${DIGEST_DIR}/${target}"
            metadata="${RUNNER_TEMP}/${target}-manifest.json"

            mapfile -t digests < <(
              find "$dir" \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' |
                sort
            )

            if ((${#digests[@]} != 2)); then
              echo "::error::Expected 2 digests for ${target}, found ${#digests[@]}"
              exit 1
            fi

            sources=()

            for digest in "${digests[@]}"; do
              if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Invalid digest for ${target}: ${digest}"
                exit 1
              fi

              sources+=("${image}@sha256:${digest}")
            done

            docker buildx imagetools create \
              --tag "${image}:${RELEASE_TAG}" \
              --metadata-file "$metadata" \
              "${sources[@]}"

            manifest_digest="$(
              jq -er \
                '."containerimage.descriptor".digest
                 | select(test("^sha256:[0-9a-f]{64}$"))' \
                "$metadata"
            )"

            key="${target//-/_}"

            {
              echo "${key}_digest=${manifest_digest}"
              echo "${key}_image=${image}:${RELEASE_TAG}"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Attest bootstrap-manager image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/bootstrap-manager
          subject-digest: ${{ steps.publish.outputs.bootstrap_manager_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest control-plane-manager image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/control-plane-manager
          subject-digest: ${{ steps.publish.outputs.control_plane_manager_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest infrastructure-manager image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/infrastructure-manager
          subject-digest: ${{ steps.publish.outputs.infrastructure_manager_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest netboot-server image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/netboot-server
          subject-digest: ${{ steps.publish.outputs.netboot_server_digest }}
          push-to-registry: true
          create-storage-record: false

  manifests:
    name: Render clusterctl manifests
    runs-on: ubuntu-24.04
    needs: merge

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          go-cache: "false"
          install-args: kustomize

      - name: Render clusterctl manifests
        env:
          BOOTSTRAP_MANAGER_IMAGE: ${{ needs.merge.outputs.bootstrap_manager_image }}
          CONTROL_PLANE_MANAGER_IMAGE: ${{ needs.merge.outputs.control_plane_manager_image }}
          INFRASTRUCTURE_MANAGER_IMAGE: ${{ needs.merge.outputs.infrastructure_manager_image }}
          NETBOOT_SERVER_IMAGE: ${{ needs.merge.outputs.netboot_server_image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/release-manifests/run.sh out

      - name: Attest clusterctl manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/bootstrap-components.yaml
            out/control-plane-components.yaml
            out/infrastructure-components.yaml
            out/metadata.yaml
            out/bootstrap-provider.yaml
            out/control-plane-provider.yaml
            out/infrastructure-provider.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clusterctl-manifests
          path: out/
          if-no-files-found: error
          retention-days: 1
