name: Release Artifacts

on:
  workflow_call:
    inputs:
      revision:
        description: ビルドするコミットSHA
        required: true
        type: string
      release_tag:
        description: 公開する不変tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IPXE_IMAGE_NAME: ${{ github.repository }}-ipxe
  IPXE_VERSION: locked

jobs:
  ipxe:
    name: Build iPXE artifact
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore iPXE binaries
        id: ipxe-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ipxe
          key: ipxe-${{ env.IPXE_VERSION }}

      - name: Download iPXE binaries
        if: steps.ipxe-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist/ipxe /tmp/ipxeboot
          go run ./cmd/locked-download -lock artifact/ipxe.lock.json -output-dir /tmp
          tar xzf /tmp/ipxeboot.tar.gz -C /tmp
          cp /tmp/ipxeboot/x86_64/ipxe.efi dist/ipxe/ipxe-x86_64.efi
          cp /tmp/ipxeboot/arm64/ipxe.efi dist/ipxe/ipxe-arm64.efi
          cp /tmp/ipxeboot/x86_64/undionly.kpxe dist/ipxe/undionly.kpxe

      - name: Publish iPXE artifact
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest="$(go run ./cmd/artifacter -dir dist/ipxe -repo "${REGISTRY}/${IPXE_IMAGE_NAME}" -tag "${{ inputs.release_tag }}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  agent-artifact:
    name: Build provisioning Agent artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go

      - name: Install Agent Artifact inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static cpio initramfs-tools-core kmod linux-image-generic systemd-boot xz-utils zstd

      - name: Prepare signing keys
        env:
          AGENT_ARTIFACT_SIGNING_KEY: ${{ secrets.AGENT_ARTIFACT_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$AGENT_ARTIFACT_SIGNING_KEY"
          printf '%s' "$AGENT_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/agent-artifact-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/agent-artifact-signing-key.pem" -pubout -out "$RUNNER_TEMP/agent-artifact-public.pem"

      - name: Build and publish Agent artifact
        env:
          AGENT_ARTIFACT_SIGNING_KEY: ${{ runner.temp }}/agent-artifact-signing-key.pem
          AGENT_ARTIFACT_SIGNING_KEY_ID: release-agent-v1
          AGENT_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository }}-provisioning-agent
          AGENT_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release/build-agent-artifact.sh

      - name: Prepare Agent release assets
        run: |
          mkdir -p dist/release-assets
          cp dist/agent-artifact/manifest.json dist/agent-artifact/manifest.signature.json dist/agent-artifact/references.env dist/release-assets/
          cp "$RUNNER_TEMP/agent-artifact-public.pem" dist/release-assets/

      - name: Upload Agent release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agent-artifact
          path: dist/release-assets/
          if-no-files-found: error

  os-artifact:
    name: Build OS artifact (${{ matrix.key }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: ubuntu-24.04-amd64-kubeadm
            os: ubuntu-24.04
            kubernetes: kubeadm
          - key: ubuntu-24.04-amd64-k0s
            os: ubuntu-24.04
            kubernetes: k0s
          - key: ubuntu-26.04-amd64-kubeadm
            os: ubuntu-26.04
            kubernetes: kubeadm
          - key: ubuntu-26.04-amd64-k0s
            os: ubuntu-26.04
            kubernetes: k0s
          - key: debian-13-amd64-kubeadm
            os: debian-13
            kubernetes: kubeadm
          - key: debian-13-amd64-k0s
            os: debian-13
            kubernetes: k0s
    env:
      ARTIFACT_CONFIG: artifact/config/${{ matrix.os }}-amd64-${{ matrix.kubernetes }}.json
      ARTIFACT_LOCK: artifact/locks/amd64.json
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go jq

      - name: Setup mkosi
        uses: systemd/mkosi@84af20892b61c8e177e391f997ded8b4cb5514f2 # v26

      - name: Install OS artifact verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils e2fsprogs python3-pefile systemd-boot cryptsetup-bin dosfstools ovmf

      - name: Build OS and Verity payloads
        run: mise run artifact-build-mkosi

      - name: Verify OS artifact
        env:
          ARTIFACT_QEMU_CPU: qemu64
          ARTIFACT_QEMU_TIMEOUT: 10m
          ARTIFACT_VERITY_WORK_DIR: dist/os-artifact/dm-verity
          ARTIFACT_BOOT_TRIAL_WORK_DIR: dist/os-artifact/boot-trial-rollback
          ARTIFACT_BOOTMETA_QEMU_WORK_DIR: dist/os-artifact/boot-trial-metadata-persistence
          ARTIFACT_BOOTLOADER_QEMU_WORK_DIR: ${{ runner.temp }}/os-artifact/bootloader-rollback
          ARTIFACT_QEMU_WORK_DIR: dist/os-artifact/qemu-firstboot
        run: |
          mise run artifact-test-dm-verity
          mise run artifact-test-boot-trial-rollback
          mise run artifact-test-boot-trial-metadata-persistence
          mise run artifact-test-bootloader-rollback
          mise run artifact-test-firstboot-qemu

      - name: Generate OS Artifact evidence summary
        if: always()
        run: >
          go run ./cmd/os-artifact-evidence-summary
          --artifact-dir dist/os-artifact
          --markdown-out dist/os-artifact/evidence-summary.md
          --json-out dist/os-artifact/evidence-summary.json

      - name: Prepare signing key
        env:
          OS_ARTIFACT_SIGNING_KEY: ${{ secrets.OS_ARTIFACT_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$OS_ARTIFACT_SIGNING_KEY"
          printf '%s' "$OS_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/os-artifact-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/os-artifact-signing-key.pem" -pubout -out "$RUNNER_TEMP/os-artifact-public.pem"

      - name: Generate signed Artifact Manifest and provenance
        env:
          ARTIFACT_IMAGE: dist/os-artifact/os.img
          ARTIFACT_VERITY: dist/os-artifact/os.verity
          ARTIFACT_KERNEL: dist/os-artifact/vmlinuz
          ARTIFACT_INITRD: dist/os-artifact/initrd
          ARTIFACT_SIGNING_KEY: ${{ runner.temp }}/os-artifact-signing-key.pem
          ARTIFACT_SIGNING_KEY_ID: release-v1
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
          ARTIFACT_SOURCE_URI: https://github.com/${{ github.repository }}
          ARTIFACT_SOURCE_REVISION: ${{ inputs.revision }}
          ARTIFACT_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARTIFACT_VERITY_ROOT_HASH="$(tr -d '\n' < dist/os-artifact/verity-root-hash)"
          export ARTIFACT_VERITY_ROOT_HASH
          mise run artifact-manifest
          mise run artifact-provenance

      - name: Publish OS Artifact
        env:
          ARTIFACT_REPOSITORY: ghcr.io/${{ github.repository }}-os-${{ matrix.os }}-amd64-${{ matrix.kubernetes }}
          ARTIFACT_TAG: ${{ inputs.release_tag }}
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
          ARTIFACT_IMAGE: dist/os-artifact/os.img
          ARTIFACT_VERITY: dist/os-artifact/os.verity
          ARTIFACT_KERNEL: dist/os-artifact/vmlinuz
          ARTIFACT_INITRD: dist/os-artifact/initrd
          ARTIFACT_SBOM: dist/os-artifact/sbom.cdx.json
          ARTIFACT_PROVENANCE: dist/os-artifact/provenance.intoto.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reference="$(mise run artifact-push)"
          printf '%s\n' "$reference" > "dist/os-artifact/reference-${{ matrix.key }}.txt"
          if [ "${{ matrix.key }}" = ubuntu-24.04-amd64-kubeadm ]; then
            sed -e "s|\${OS_ARTIFACT_REF:=oci://registry.sample.walnuts.dev/tart/ubuntu@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}|$reference|" -e "s|\${OS_ARTIFACT_REGISTRY:=registry.sample.walnuts.dev}|ghcr.io|" config/templates/cluster-template-kubeadm-ubuntu.yaml > dist/os-artifact/cluster-template-kubeadm-ubuntu.yaml
          fi

      - name: Prepare OS release assets
        run: |
          mkdir -p dist/release-assets
          cp dist/os-artifact/reference-${{ matrix.key }}.txt dist/release-assets/
          cp "$RUNNER_TEMP/os-artifact-public.pem" "dist/release-assets/os-artifact-${{ matrix.key }}-public.pem"
          if [ "${{ matrix.key }}" = ubuntu-24.04-amd64-kubeadm ]; then
            cp dist/os-artifact/cluster-template-kubeadm-ubuntu.yaml dist/release-assets/
          fi

      - name: Upload OS build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: os-evidence-${{ matrix.key }}
          path: |
            dist/os-artifact/evidence-summary.md
            dist/os-artifact/evidence-summary.json
            dist/os-artifact/qemu-firstboot/
            dist/os-artifact/boot-trial-metadata-persistence/
            dist/os-artifact/boot-trial-rollback/
            ${{ runner.temp }}/os-artifact/bootloader-rollback/
          if-no-files-found: warn

      - name: Upload OS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-os-${{ matrix.key }}
          path: dist/release-assets/
          if-no-files-found: error

  controller-build:
    name: Build controller image (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - key: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ matrix.key }}
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ matrix.key }}

      - name: Upload digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Store image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-digest-${{ matrix.key }}
          path: /tmp/digests/
          retention-days: 1

  controller-manifest:
    name: Publish multi-architecture controller image
    runs-on: ubuntu-24.04
    needs: controller-build
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: controller-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish manifest list
        id: manifest
        working-directory: /tmp/digests
        run: |
          images=()
          for digest in *; do
            images+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_NAME}:${{ inputs.release_tag }}" "${images[@]}"
          digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ inputs.release_tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release-manifests:
    name: Build provider release manifests
    runs-on: ubuntu-24.04
    needs: [ipxe, agent-artifact, os-artifact, controller-manifest]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/kustomize/kustomize/v5

      - name: Build release manifests
        env:
          AGENT_ARTIFACT_SIGNING_KEY: ${{ secrets.AGENT_ARTIFACT_SIGNING_KEY }}
          OS_ARTIFACT_SIGNING_KEY: ${{ secrets.OS_ARTIFACT_SIGNING_KEY }}
        run: |
          test -n "$AGENT_ARTIFACT_SIGNING_KEY"
          test -n "$OS_ARTIFACT_SIGNING_KEY"
          umask 077
          printf '%s' "$AGENT_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/agent-artifact-signing-key.pem"
          printf '%s' "$OS_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/os-artifact-signing-key.pem"
          AGENT_ARTIFACT_PUBLIC_KEY_PEM="$(openssl pkey -in "$RUNNER_TEMP/agent-artifact-signing-key.pem" -pubout)"
          OS_ARTIFACT_PUBLIC_KEY_PEM="$(openssl pkey -in "$RUNNER_TEMP/os-artifact-signing-key.pem" -pubout)"
          export AGENT_ARTIFACT_PUBLIC_KEY_PEM OS_ARTIFACT_PUBLIC_KEY_PEM
          IMG="${REGISTRY}/${IMAGE_NAME}:${{ inputs.release_tag }}@${{ needs.controller-manifest.outputs.digest }}" IPXE_REF="${REGISTRY}/${IPXE_IMAGE_NAME}:${{ inputs.release_tag }}@${{ needs.ipxe.outputs.digest }}" AGENT_ARTIFACT_REF="${REGISTRY}/${{ github.repository }}-provisioning-agent:${{ inputs.release_tag }}" mise run build-installer-real-hardware
          mkdir -p dist/release-assets
          cp dist/install-real-hardware.yaml dist/release-assets/infrastructure-components.yaml
          cp metadata.yaml dist/release-assets/metadata.yaml
          sed "s/REPLACE_WITH_RELEASE_VERSION/${{ inputs.release_tag }}/" config/operator/infrastructure-provider.yaml > dist/release-assets/operator-provider.yaml

      - name: Upload provider release manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provider-manifests
          path: dist/release-assets/
          if-no-files-found: error
