name: Release Verification

on:
  workflow_call:
    inputs:
      revision:
        description: 検証するコミットSHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  kind-e2e:
    name: Kind E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen kind

      - name: Run Kind E2E
        run: mise run test-e2e

  provisioning-e2e:
    name: Provisioning E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/kustomize/kustomize/v5 kubectl jq

      - name: Install Agent initramfs inputs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xz-utils zstd

      - name: Run Provisioning E2E
        run: mise run test-provisioning-e2e

      - name: Collect diagnostic evidence
        if: failure()
        run: mise run collect-provisioning-e2e-evidence

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provisioning-e2e-evidence
          path: |
            _artifacts/
            *.log
            *.pcap
            /tmp/dnsmasq.leases
          retention-days: 7
