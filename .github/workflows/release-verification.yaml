name: Release Verification

on:
  workflow_call:
    inputs:
      revision:
        description: 検証するコミットSHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  kind-e2e:
    name: Kind E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen kind

      - name: Run Kind E2E
        run: mise run test-e2e

  os-artifact-e2e:
    name: Build OS artifact (e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      os_artifact_ref: ${{ steps.push.outputs.os_artifact_ref }}
      os_artifact_registry: ghcr.io
    env:
      ARTIFACT_CONFIG: artifact/config/ubuntu-24.04-amd64-kubeadm.json
      ARTIFACT_LOCK: artifact/locks/amd64.json
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go jq

      - name: Setup mkosi
        uses: systemd/mkosi@84af20892b61c8e177e391f997ded8b4cb5514f2 # v26

      - name: Install OS artifact verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils e2fsprogs python3-pefile systemd-boot cryptsetup-bin dosfstools ovmf

      - name: Build OS and Verity payloads
        run: mise run artifact-build-mkosi

      - name: Prepare signing key
        env:
          OS_ARTIFACT_SIGNING_KEY: ${{ secrets.OS_ARTIFACT_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$OS_ARTIFACT_SIGNING_KEY"
          printf '%s' "$OS_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/os-artifact-signing-key.pem"

      - name: Generate signed Artifact Manifest and provenance
        env:
          ARTIFACT_IMAGE: dist/os-artifact/os.img
          ARTIFACT_VERITY: dist/os-artifact/os.verity
          ARTIFACT_KERNEL: dist/os-artifact/vmlinuz
          ARTIFACT_INITRD: dist/os-artifact/initrd
          ARTIFACT_SIGNING_KEY: ${{ runner.temp }}/os-artifact-signing-key.pem
          ARTIFACT_SIGNING_KEY_ID: e2e-os-artifact
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
          ARTIFACT_SOURCE_URI: https://github.com/${{ github.repository }}
          ARTIFACT_SOURCE_REVISION: ${{ inputs.revision }}
          ARTIFACT_BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARTIFACT_VERITY_ROOT_HASH="$(tr -d '\n' < dist/os-artifact/verity-root-hash)"
          export ARTIFACT_VERITY_ROOT_HASH
          mise run artifact-manifest
          mise run artifact-provenance

      - name: Publish OS Artifact
        id: push
        env:
          ARTIFACT_REPOSITORY: ghcr.io/${{ github.repository }}-os-ubuntu-24.04-amd64-kubeadm
          ARTIFACT_TAG: e2e-${{ github.sha }}
          ARTIFACT_OUTPUT_DIR: dist/os-artifact
          ARTIFACT_IMAGE: dist/os-artifact/os.img
          ARTIFACT_VERITY: dist/os-artifact/os.verity
          ARTIFACT_KERNEL: dist/os-artifact/vmlinuz
          ARTIFACT_INITRD: dist/os-artifact/initrd
          ARTIFACT_SBOM: dist/os-artifact/sbom.cdx.json
          ARTIFACT_PROVENANCE: dist/os-artifact/provenance.intoto.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reference="$(mise run artifact-push | tail -n 1)"
          echo "os_artifact_ref=${reference}" >> "$GITHUB_OUTPUT"

      - name: Upload OS artifact for e2e
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: os-artifact-e2e
          path: |
            dist/os-artifact/os.img
            dist/os-artifact/os.verity
            dist/os-artifact/verity-root-hash
          retention-days: 1

  provisioning-e2e:
    name: Provisioning E2E
    needs: [os-artifact-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OS_ARTIFACT_REF: ${{ needs.os-artifact-e2e.outputs.os_artifact_ref }}
      OS_ARTIFACT_REGISTRY: ${{ needs.os-artifact-e2e.outputs.os_artifact_registry }}
      PROVISIONING_E2E_OS_ARTIFACT_PATH: dist/os-artifact/os.img
      PROVISIONING_E2E_OS_VERITY_PATH: dist/os-artifact/os.verity
      FULL_PROVISIONING_E2E_ENABLED: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/kustomize/kustomize/v5 kubectl jq

      - name: Install Agent initramfs inputs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xz-utils zstd

      - name: Download OS artifact for e2e
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: os-artifact-e2e
          path: dist/os-artifact/

      - name: Run Provisioning E2E
        run: |
          PROVISIONING_E2E_OS_VERITY_ROOT_HASH="$(tr -d '\n' < dist/os-artifact/verity-root-hash)"
          export PROVISIONING_E2E_OS_VERITY_ROOT_HASH
          mise run test-provisioning-e2e

      - name: Collect diagnostic evidence
        if: failure()
        run: mise run collect-provisioning-e2e-evidence

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provisioning-e2e-evidence
          path: |
            _artifacts/
            *.log
            *.pcap
            /tmp/dnsmasq.leases
          retention-days: 7
