name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag for manual publishing.
        required: true
        default: dev

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IPXE_IMAGE_NAME: ${{ github.repository }}-ipxe
  IPXE_VERSION: locked

jobs:
  ipxe:
    name: Build and Push iPXE OCI Artifact
    runs-on: ubuntu-slim
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: iPXE binaries cache
        id: ipxe-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/ipxe
          key: ipxe-${{ env.IPXE_VERSION }}
          restore-keys: |
            ipxe-

      - name: Download iPXE binaries
        if: ${{ steps.ipxe-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p dist/ipxe
          go run ./cmd/locked-download -lock artifact/ipxe.lock.json -output-dir /tmp
          rm -rf /tmp/ipxeboot
          tar xzf /tmp/ipxeboot.tar.gz -C /tmp
          cp /tmp/ipxeboot/x86_64/ipxe.efi dist/ipxe/ipxe-x86_64.efi
          cp /tmp/ipxeboot/arm64/ipxe.efi dist/ipxe/ipxe-arm64.efi
          cp /tmp/ipxeboot/x86_64/undionly.kpxe dist/ipxe/undionly.kpxe
          rm -rf /tmp/ipxeboot /tmp/ipxeboot.tar.gz

      - name: Resolve image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            image_tag="$RELEASE_TAG"
          else
            image_tag="$MANUAL_IMAGE_TAG"
          fi
          [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [ "$image_tag" != latest ]
          echo "ImageTag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Push OCI Artifact using ORAS
        id: push
        run: |
          digest=$(go run cmd/artifacter/main.go \
            -dir dist/ipxe \
            -repo ${{ env.REGISTRY }}/${{ env.IPXE_IMAGE_NAME }} \
            -tag ${{ steps.tag.outputs.ImageTag }})
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - key: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
          - key: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: latest

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ matrix.key }}
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ matrix.key }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch image
    runs-on: ubuntu-latest
    needs: build
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: latest

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            image_tag="$RELEASE_TAG"
          else
            image_tag="$MANUAL_IMAGE_TAG"
          fi
          [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [ "$image_tag" != latest ]
          echo "ImageTag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:latest" \
            -t "${REGISTRY}/${IMAGE_NAME}:${{ steps.tag.outputs.ImageTag }}" \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          digest=$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.tag.outputs.ImageTag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  manifest:
    name: Release manifest
    runs-on: ubuntu-slim
    needs: [merge, ipxe]
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go go:sigs.k8s.io/controller-tools/cmd/controller-gen go:sigs.k8s.io/kustomize/kustomize/v5

      - name: Build release manifest
        env:
          AGENT_ARTIFACT_SIGNING_KEY: ${{ secrets.AGENT_ARTIFACT_SIGNING_KEY }}
          OS_ARTIFACT_PUBLIC_KEY_PEM: ${{ secrets.OS_ARTIFACT_PUBLIC_KEY_PEM }}
        run: |
          test -n "$AGENT_ARTIFACT_SIGNING_KEY"
          printf '%s' "$AGENT_ARTIFACT_SIGNING_KEY" > "$RUNNER_TEMP/agent-artifact-signing-key.pem"
          AGENT_ARTIFACT_PUBLIC_KEY_PEM="$(openssl pkey -in "$RUNNER_TEMP/agent-artifact-signing-key.pem" -pubout)"
          export AGENT_ARTIFACT_PUBLIC_KEY_PEM
          release_tag="${{ github.event_name == 'release' && github.ref_name || inputs.image_tag }}"
          IMG="${REGISTRY}/${IMAGE_NAME}:${release_tag}@${{ needs.merge.outputs.digest }}" \
          IPXE_REF="${REGISTRY}/${IPXE_IMAGE_NAME}:${release_tag}@${{ needs.ipxe.outputs.digest }}" \
          AGENT_ARTIFACT_REF="${REGISTRY}/${{ github.repository }}-provisioning-agent:${release_tag}" \
            mise run build-installer-real-hardware
          cp dist/install-real-hardware.yaml dist/infrastructure-components.yaml
          cp metadata.yaml dist/metadata.yaml
          sed "s/REPLACE_WITH_RELEASE_VERSION/$release_tag/" \
            config/operator/infrastructure-provider.yaml > dist/operator-provider.yaml

      - name: Upload release manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install.yaml
          path: |
            dist/infrastructure-components.yaml
            dist/metadata.yaml
            dist/operator-provider.yaml
          if-no-files-found: error

  release-assets:
    runs-on: ubuntu-slim
    needs: [manifest, merge, ipxe]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download release manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install.yaml
          path: dist

      - name: Upload provider assets to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/infrastructure-components.yaml
            dist/metadata.yaml
            dist/operator-provider.yaml
          tag_name: ${{ github.ref_name }}
