name: Release
run-name: Release ${{ inputs.release_tag || 'next patch' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v1.2.3). Empty uses the next patch tag after the latest stable vX.Y.Z tag (or v0.1.0)."
        required: false
        type: string
      release_type:
        description: GitHub Release type
        required: true
        default: latest
        type: choice
        options:
          - none
          - pre-release
          - latest

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release-target.outputs.release_tag }}
    steps:
      - name: Check out release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require default branch
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]

      - name: Resolve and validate tag
        id: release-target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ -z "$latest_tag" ]; then
              RELEASE_TAG="v0.1.0"
            else
              version="${latest_tag#v}"
              IFS=. read -r major minor patch <<< "$version"
              RELEASE_TAG="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [ "$RELEASE_TAG" != latest ]
          git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Create draft release
    needs: [validate]
    if: inputs.release_type != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create draft release pinned to commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft

  artifacts:
    name: Build release artifacts
    needs: [validate, prepare-release]
    if: always() && needs.validate.result == 'success' && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    uses: ./.github/workflows/release-artifacts.yaml
    with:
      revision: ${{ github.sha }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
    secrets: inherit

  publish:
    name: Create GitHub Release
    needs: [validate, artifacts]
    if: inputs.release_type != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clusterctl-manifests
          path: out

      # clusterctl/cluster-api-operatorはmetadata.yaml、infrastructure-components.yamlという
      # 固定ファイル名のリリースassetを前提にしているため、ここでは名前を変更しない。
      - name: Upload manifests to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            out/infrastructure-components.yaml \
            out/metadata.yaml \
            out/infrastructure-provider.yaml

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.release_type }}" = "latest" ]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=true \
              --latest=false
          fi

      - name: Verify immutable release and release attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          is_immutable="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)"
          if [ "$is_immutable" != "true" ]; then
            echo "release $RELEASE_TAG is not immutable" >&2
            exit 1
          fi

          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
