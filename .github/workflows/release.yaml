name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 公開する不変のGit tag
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-slim
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]
          [ "$RELEASE_TAG" != latest ]
          git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"

  verification:
    name: Verify release candidate
    needs: validate
    uses: ./.github/workflows/release-verification.yaml
    with:
      revision: ${{ github.sha }}

  artifacts:
    name: Build release artifacts
    needs: verification
    uses: ./.github/workflows/release-artifacts.yaml
    with:
      revision: ${{ github.sha }}
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  publish:
    name: Create GitHub Release
    needs: artifacts
    runs-on: ubuntu-slim
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/release-assets/*
