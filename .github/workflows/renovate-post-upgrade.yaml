name: Renovate Post Upgrade

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize-artifact-inputs:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up post-upgrade tools
        uses: ./.github/actions/setup-tools
        with:
          install-args: go jq npm:@devcontainers/cli

      - name: Refresh locked artifact inputs
        run: bash .github/scripts/renovate/post-upgrade.sh

      - name: Commit refreshed artifact inputs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .devcontainer/devcontainer-lock.json artifact/mkosi/mkosi.conf artifact/locks artifact/ipxe.lock.json test/envtest/crds/cluster-api test/e2e/provisioning/repository_config_test.go utils/testutils/envtest/assets.go
          git commit --signoff -m 'chore: Renovate更新後のArtifact入力を同期'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
