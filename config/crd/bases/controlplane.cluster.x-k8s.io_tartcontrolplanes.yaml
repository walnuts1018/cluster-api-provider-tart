kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: tartcontrolplanes.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: TartControlPlane
    listKind: TartControlPlaneList
    plural: tartcontrolplanes
    shortNames:
    - tcp
    singular: tartcontrolplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Available
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TartControlPlaneはtartcontrolplanes APIのschemaである。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TartControlPlaneSpecはTartControlPlaneのdesired stateを定義する。Tartはcontrol
              plane endpoint(VIPやLB)をprovisionせず、endpointはCluster.spec.controlPlaneEndpointから外部に供給される。control
              planeのin-place updateはCAPI KCP patternに従い、CanUpdateMachine検証、Machine/InfraMachine/BootstrapConfigのdesired
              spec更新、in-place-updates.internal.cluster.x-k8s.io/update-in-progress
              annotation設定、UpdateMachine hook pending設定、Machine controller連携の順で扱う。
            properties:
              bootstrapConfigTemplateRef:
                description: bootstrapConfigTemplateRefは各control-plane MachineのTartBootstrapConfigをrenderするTartBootstrapConfigTemplateを参照する。
                properties:
                  apiGroup:
                    description: |-
                      apiGroup is the group of the resource being referenced.
                      apiGroup must be fully qualified domain name.
                      The corresponding version for this reference will be looked up from the contract
                      labels of the corresponding CRD of the resource being referenced.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  kind:
                    description: |-
                      kind of the resource being referenced.
                      kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                    type: string
                  name:
                    description: |-
                      name of the resource being referenced.
                      name must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
              machineTemplate:
                description: TartControlPlaneMachineTemplateは各control-plane CAPI Machineを作成するtemplateである。
                properties:
                  metadata:
                    description: |-
                      ObjectMeta is metadata that all persisted resources must have, which includes all objects
                      users must create. This is a copy of customizable fields from metav1.ObjectMeta.

                      ObjectMeta is embedded in `Machine.Spec`, `MachineDeployment.Template` and `MachineSet.Template`,
                      which are not top-level Kubernetes objects. Given that metav1.ObjectMeta has lots of special cases
                      and read-only fields which end up in the generated CRD validation, having it as a subset simplifies
                      the API and some issues that can impact user experience.

                      During the [upgrade to controller-tools@v2](https://github.com/kubernetes-sigs/cluster-api/pull/1054)
                      for v1alpha2, we noticed a failure would occur running Cluster API test suite against the new CRDs,
                      specifically `spec.metadata.creationTimestamp in body must be of type string: "null"`.
                      The investigation showed that `controller-tools@v2` behaves differently than its previous version
                      when handling types from [metav1](k8s.io/apimachinery/pkg/apis/meta/v1) package.

                      In more details, we found that embedded (non-top level) types that embedded `metav1.ObjectMeta`
                      had validation properties, including for `creationTimestamp` (metav1.Time).
                      The `metav1.Time` type specifies a custom json marshaller that, when IsZero() is true, returns `null`
                      which breaks validation because the field isn't marked as nullable.

                      In future versions, controller-tools@v2 might allow overriding the type and validation for embedded
                      types. When that happens, this hack should be revisited.
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: TartControlPlaneMachineTemplateSpecは各control-plane
                      CAPI MachineのinfrastructureRef、削除動作、readiness gate、taintを作成するtemplateである。
                    properties:
                      deletion:
                        description: TartControlPlaneMachineTemplateDeletionSpecはnode-disruptiveな削除timeoutを保持する。rolloutを発生させないfieldとは分離する。
                        minProperties: 1
                        properties:
                          nodeDeletionTimeoutSeconds:
                            format: int32
                            minimum: 0
                            type: integer
                          nodeDrainTimeoutSeconds:
                            format: int32
                            minimum: 0
                            type: integer
                          nodeVolumeDetachTimeoutSeconds:
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      infrastructureRef:
                        description: infrastructureRefはTartMachineTemplateを参照する。
                        properties:
                          apiGroup:
                            description: |-
                              apiGroup is the group of the resource being referenced.
                              apiGroup must be fully qualified domain name.
                              The corresponding version for this reference will be looked up from the contract
                              labels of the corresponding CRD of the resource being referenced.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          kind:
                            description: |-
                              kind of the resource being referenced.
                              kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                            type: string
                          name:
                            description: |-
                              name of the resource being referenced.
                              name must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - apiGroup
                        - kind
                        - name
                        type: object
                      readinessGates:
                        description: readinessGatesはMachine readinessを評価する追加Conditionを指定する。
                        items:
                          description: MachineReadinessGate contains the type of a
                            Machine condition to be used as a readiness gate.
                          properties:
                            conditionType:
                              description: |-
                                conditionType refers to a condition with matching type in the Machine's condition list.
                                If the conditions doesn't exist, it will be treated as unknown.
                                Note: Both Cluster API conditions or conditions added by 3rd party controllers can be used as readiness gates.
                              maxLength: 316
                              minLength: 1
                              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                              type: string
                            polarity:
                              description: |-
                                polarity of the conditionType specified in this readinessGate.
                                Valid values are Positive, Negative and omitted.
                                When omitted, the default behaviour will be Positive.
                                A positive polarity means that the condition should report a true status under normal conditions.
                                A negative polarity means that the condition should report a false status under normal conditions.
                              enum:
                              - Positive
                              - Negative
                              type: string
                          required:
                          - conditionType
                          type: object
                        type: array
                      taints:
                        description: taintsは作成したMachineへ適用するnode taintを指定する。
                        items:
                          description: MachineTaint defines a taint equivalent to
                            corev1.Taint, but additionally having a propagation field.
                          properties:
                            effect:
                              description: effect is the effect for the taint. Valid
                                values are NoSchedule, PreferNoSchedule and NoExecute.
                              enum:
                              - NoSchedule
                              - PreferNoSchedule
                              - NoExecute
                              type: string
                            key:
                              description: |-
                                key is the taint key to be applied to a node.
                                Must be a valid qualified name of maximum size 63 characters
                                with an optional subdomain prefix of maximum size 253 characters,
                                separated by a `/`.
                              maxLength: 317
                              minLength: 1
                              pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$
                              type: string
                            propagation:
                              description: |-
                                propagation defines how this taint should be propagated to nodes.
                                Valid values are 'Always' and 'OnInitialization'.
                                Always: The taint will be continuously reconciled. If it is not set for a node, it will be added during reconciliation.
                                OnInitialization: The taint will be added during node initialization. If it gets removed from the node later on it will not get added again.
                              enum:
                              - Always
                              - OnInitialization
                              type: string
                            value:
                              description: |-
                                value is the taint value corresponding to the taint key.
                                It must be a valid label value of maximum size 63 characters.
                              maxLength: 63
                              minLength: 1
                              pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                              type: string
                          required:
                          - effect
                          - key
                          - propagation
                          type: object
                        type: array
                    required:
                    - infrastructureRef
                    type: object
                type: object
              replicas:
                description: replicasはdesired control plane Machine数である。
                format: int32
                type: integer
              version:
                description: |-
                  versionはdesired Kubernetes versionである。先頭にvを付けたsemantic versioning(prerelease/build
                  metadataは任意)に従わなければならない。下限versionの強制はTalos/Kubernetesの互換性表に委ねるため、
                  ここではsemver形式としてparse可能であることだけを検証する。
                maxLength: 256
                minLength: 1
                pattern: ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
                type: string
            required:
            - bootstrapConfigTemplateRef
            - machineTemplate
            - version
            type: object
          status:
            description: TartControlPlaneStatusはTartControlPlaneのobserved stateを定義する。
            properties:
              availableReplicas:
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: TartControlPlaneInitializationStatusは初回etcd/API server
                  bootstrapを追跡する。
                minProperties: 1
                properties:
                  controlPlaneInitialized:
                    description: controlPlaneInitializedはworkload Kubernetes API serverがrequestを受理した時点でtrueになる。全NodeがReadyであることやCNIがinstall済みであることは意味しない。
                    type: boolean
                type: object
              kubernetesUpgrade:
                description: |-
                  kubernetesUpgradeはcluster-wide Kubernetes upgradeのcoarse-grainedな観測結果である。
                  upgrade手順のstepやprogram counterは保持せず、再起動後もspecとcluster観測だけから再計算する。
                minProperties: 1
                properties:
                  observedVersion:
                    description: observedVersionはclusterのKubernetes componentから観測した最も低いversionである。
                    maxLength: 256
                    type: string
                  targetVersion:
                    description: targetVersionは最後にupgradeを要求したdesired Kubernetes versionである。
                    maxLength: 256
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              readyReplicas:
                format: int32
                type: integer
              replicas:
                format: int32
                type: integer
              selector:
                type: string
              upToDateReplicas:
                format: int32
                type: integer
              versions:
                description: versionsはcontrol-plane Machine群で観測した実際のKubernetes versionを古い順に並べる。top-levelのstatus.versionは持たない。
                items:
                  description: StatusVersion groups version-related status information.
                  properties:
                    replicas:
                      description: replicas is the number of replicas at this version.
                      format: int32
                      minimum: 1
                      type: integer
                    version:
                      description: version is the Kubernetes version.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - version
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - version
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
