                                    field.
                                  properties:
                                    effect:
                                      description: effect is the effect for the taint.
                                        Valid values are NoSchedule, PreferNoSchedule
                                        and NoExecute.
                                      enum:
                                      - NoSchedule
                                      - PreferNoSchedule
                                      - NoExecute
                                      type: string
                                    key:
                                      description: |-
                                        key is the taint key to be applied to a node.
