---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tarthosts.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: TartHost
    listKind: TartHostList
    plural: tarthosts
    singular: tarthost
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Claimed')].status
      name: Claimed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TartHost is the Schema for the tarthosts API. TartHost is a management-cluster-wide,
          cluster-scoped inventory of a physical or virtual Host that outlives any single CAPI
          Machine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TartHostSpec defines the desired state of a physical or virtual
              Host inventory entry.
            properties:
              architecture:
                description: architecture is a Host selector criterion.
                type: string
              consumerRef:
                description: |-
                  consumerRef is the controller-managed exclusive allocation binding. It is
                  established via an atomic compare-and-swap (resourceVersion-checked Update or a
                  JSON Patch "test") and must not be treated as a normal user-editable field.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              failureDomain:
                description: failureDomain is a Host selector criterion matched against
                  Machine.spec.failureDomain.
                type: string
              forgetApproved:
                description: |-
                  forgetApproved must be set before a Claimed or Retained Host can be deleted. It
                  authorizes removing the Host from inventory only; it never triggers power off,
                  Talos reset, or disk wipe.
                type: boolean
              id:
                description: |-
                  id is an immutable random UUID that identifies this Host independently of
                  metadata.uid, so backups of the management cluster can recreate the same
                  physical Host identity and ProviderID.
                type: string
                x-kubernetes-validations:
                - message: id is immutable
                  rule: self == oldSelf
              macAddress:
                description: |-
                  macAddress is the primary enrollment identity used to bind an observed boot
                  attempt to this Host before any other inventory is known.
                type: string
              power:
                description: power describes this Host's power control and stop-confirmation
                  capability.
                properties:
                  backend:
                    description: backend selects which power capability implementation
                      to use.
                    enum:
                    - Redfish
                    - WakeOnLAN
                    - Manual
                    type: string
                  redfish:
                    description: RedfishPowerConfig configures out-of-band power control
                      and stop confirmation via Redfish.
                    properties:
                      address:
                        description: address is the Redfish service root base URL.
                        type: string
                      credentialSecretRef:
                        description: credentialSecretRef references a Secret with
                          "username" and "password" keys.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      insecureSkipVerify:
                        description: insecureSkipVerify disables TLS certificate verification
                          for the Redfish endpoint.
                        type: boolean
                      systemID:
                        description: systemID is the Redfish ComputerSystem identifier.
                          If empty, the first system is used.
                        type: string
                    required:
                    - address
                    - credentialSecretRef
                    type: object
                  wakeOnLAN:
                    description: |-
                      WakeOnLANPowerConfig configures Wake-on-LAN power-on. Stop confirmation for this backend
                      relies on observing that the authenticated Talos API becomes unreachable after a Shutdown
                      RPC is accepted, which is not proof of physical power-off.
                    properties:
                      broadcastAddress:
                        description: broadcastAddress is the network broadcast address
                          used to send the magic packet.
                        type: string
                    type: object
                required:
                - backend
                type: object
              retainedFrom:
                description: |-
                  retainedFrom is the controller-managed record of the previous consumer, kept
                  after Machine deletion so this Host is not auto-allocated again until an explicit
                  reuse approval is given.
                properties:
                  clusterID:
                    description: clusterID is the TartCluster.spec.id the previous
                      consumer belonged to.
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - clusterID
                - name
                - namespace
                - uid
                type: object
              reuseApproval:
                description: reuseApproval must match the current retainedFrom.uid
                  before this Host becomes Reusable.
                properties:
                  retainedFromUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - retainedFromUID
                type: object
              reuseMode:
                description: reuseMode selects Adopt or Reprovision once the Host
                  becomes Reusable.
                enum:
                - Adopt
                - Reprovision
                type: string
              reusePolicy:
                default: Retain
                description: reusePolicy is the user intent for whether a Retained
                  Host may become Reusable.
                enum:
                - Retain
                - Reusable
                type: string
            required:
            - id
            - macAddress
            - power
            type: object
          status:
            description: TartHostStatus defines the observed state of a TartHost.
            properties:
              addresses:
                description: MachineAddresses is a slice of MachineAddress items to
                  be used by infrastructure providers.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inventory:
                description: HostInventory is the hardware inventory observed via
                  maintenance Talos discovery.
                properties:
                  disks:
                    items:
                      description: |-
                        DiskInventory is an observed disk on the Host, identified by a stable Talos disk
                        selector rather than an unstable Linux device path.
                      properties:
                        selector:
                          type: string
                        sizeBytes:
                          format: int64
                          type: integer
                      required:
                      - selector
                      type: object
                    type: array
                  systemUUID:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
