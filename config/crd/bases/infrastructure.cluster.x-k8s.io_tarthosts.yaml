---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tarthosts.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: TartHost
    listKind: TartHostList
    plural: tarthosts
    shortNames:
    - thost
    singular: tarthost
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Available
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TartHostはtarthosts APIのschemaである。TartHostは単一のCAPI Machineより長く存続する、物理または仮想Hostのmanagement
          cluster全体にわたるcluster-scoped inventoryである。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TartHostSpecは物理または仮想Host inventory entryのdesired stateを定義する。
            properties:
              architecture:
                description: architectureはHost selectorの条件である。
                type: string
              consumerRef:
                description: consumerRefはcontrollerが管理するexclusive allocation bindingである。atomic
                  compare-and-swap(resourceVersionを確認するUpdateまたはJSON Patchのtest)で確立し、通常のユーザー編集fieldとして扱わない。
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              deletionApproval:
                description: deletionApprovalはClaimedまたはRetained Hostを削除する前に現在のHost
                  stateと一致しなければならない。Hostをinventoryから除去することだけを承認し、power off、Talos reset、disk
                  wipeは実行しない。
                properties:
                  consumerUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                  previousConsumerUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                type: object
              failureDomain:
                description: failureDomainはMachine.spec.failureDomainと照合するHost selectorの条件である。
                type: string
              hostID:
                description: hostIDはmetadata.uidとは独立してHostを識別するimmutableなrandom UUIDである。management
                  clusterのbackupから同じ物理Host identityとProviderIDを復元するために使い、controllerが所有するspec
                  fieldである。
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                type: string
                x-kubernetes-validations:
                - message: hostID may only be initialized once and is immutable afterwards
                  rule: self == oldSelf || (oldSelf == '' && self != '')
              macAddress:
                description: macAddressは他のinventoryが未知の段階でobserved boot attemptをこのHostへbindするための主enrollment
                  identityである。
                pattern: ^([0-9a-fA-F]{2}[:-]){5}([0-9a-fA-F]{2})$
                type: object
              power:
                description: powerはこのHostの電源制御と停止確認の機能を定義する。
                properties:
                  backend:
                    description: backendは使用する電源機能の実装を選択する。
                    enum:
                    - Redfish
                    - WakeOnLAN
                    - Manual
                    type: string
                  redfish:
                    description: RedfishPowerConfigはRedfish経由のout-of-band電源制御と停止確認を設定する。
                    properties:
                      address:
                        description: addressはRedfish service rootのbase URLである。
                        type: string
                      caSecretRef:
                        description: caSecretRefはRedfish endpointのTLS certificateを検証するcustom
                          CA certificate bundleをca.crt keyに持つSecretを任意に参照する。provider管理namespaceから解決し、省略時はinsecureSkipVerifyがtrueでない限りsystem
                          trust bundleを使う。
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      credentialSecretRef:
                        description: credentialSecretRefはusernameとpassword keyを持つSecretをprovider管理namespaceから参照する。
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      insecureSkipVerify:
                        description: insecureSkipVerifyはRedfish endpointのTLS certificate検証を無効化する。custom
                          CA検証が実行できない場合だけ使用する。
                        type: boolean
                      systemID:
                        description: systemIDはRedfish ComputerSystemのidentifierである。空にできるのはSystems
                          collectionが単一memberの場合だけである。
                        type: string
                    required:
                    - address
                    - credentialSecretRef
                    type: object
                  wakeOnLAN:
                    description: WakeOnLANPowerConfigはWake-on-LANによる電源投入を設定する。このbackendの停止確認はShutdown
                      RPC受理後にauthenticated Talos APIが到達不能になることを観測するが、物理的な電源断の証明にはならない。
                    properties:
                      broadcastAddress:
                        description: broadcastAddressはマジックパケット送信に使用するnetwork broadcast
                          addressである。
                        type: string
                    type: object
                required:
                - backend
                type: object
                x-kubernetes-validations:
                - message: backend must select exactly its matching power configuration
                  rule: (self.backend == 'Redfish' && has(self.redfish) && !has(self.wakeOnLAN))
                    || (self.backend == 'WakeOnLAN' && has(self.wakeOnLAN) && !has(self.redfish))
                    || (self.backend == 'Manual' && !has(self.redfish) && !has(self.wakeOnLAN))
              previousConsumerRef:
                description: previousConsumerRefはcontrollerが管理する直前consumerのrecordである。Machine削除後も保持し、明示的なreuse
                  approvalがあるまでこのHostを再度自動allocationしない。
                properties:
                  clusterID:
                    description: clusterIDは直前consumerが所属していたTartCluster.spec.clusterIDである。
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - clusterID
                - name
                - namespace
                - uid
                type: object
              reuseApproval:
                description: reuseApprovalはこのHostを再利用可能にする前に現在のpreviousConsumerRef.uidと一致しなければならない。
                properties:
                  previousConsumerUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - previousConsumerUID
                type: object
              reuseMode:
                description: reuseModeはHostの再利用承認後にAdoptまたはReprovisionを選択する。
                enum:
                - Adopt
                - Reprovision
                type: string
              reusePolicy:
                default: Retain
                description: reusePolicyはRetained Hostを再利用できるかというユーザーの意図である。
                enum:
                - Retain
                - AllowReuse
                type: string
              talosAPIAddress:
                description: talosAPIAddressはこのHostのTalos APIへ到達できる任意のaddressまたはDNS
                  nameである。到達性のhintまたはoverrideに過ぎず、controllerはconfiguration apply前にobserved
                  MAC addressを検証する。
                maxLength: 512
                type: string
            required:
            - macAddress
            - power
            type: object
          status:
            description: TartHostStatusはTartHostのobserved stateを定義する。
            properties:
              addresses:
                description: MachineAddresses is a slice of MachineAddress items to
                  be used by infrastructure providers.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              bootAttempts:
                description: bootAttemptsは直近のboot identity観測をboundedに保持する。古いattemptを現在のHost
                  identityとして再利用せず、現在のinventoryと照合するための観測履歴である。
                items:
                  description: BootAttemptはHost inventoryで観測したTalos kernel bootの履歴である。履歴はboundedであり、allocationのidentityは常に現在のMAC、system
                    UUID、disk観測で検証する。
                  properties:
                    bootID:
                      description: bootIDはTalos kernel bootのstable identifierである。
                      type: string
                    endpoint:
                      description: endpointはこのbootのinventoryへ接続したendpointであり、credentialや秘密情報を含まない。
                      type: string
                    firstObservedAt:
                      description: firstObservedAtはこのbootを最初に観測した時刻である。
                      format: date-time
                      type: string
                    lastObservedAt:
                      description: lastObservedAtはこのbootを最後に観測した時刻である。
                      format: date-time
                      type: string
                    systemUUID:
                      description: systemUUIDはboot時に観測したsystem UUIDであり、空の場合がある。
                      type: string
                  required:
                  - bootID
                  - firstObservedAt
                  - lastObservedAt
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - bootID
                x-kubernetes-list-type: map
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentTalosIdentityRef:
                description: |-
                  currentTalosIdentityRefはこのHostが現在保持しているTalos installationのidentityである。
                  Machineの寿命ではなくHost上のinstallationの寿命に従い、Reprovisionのreset完了またはHostのforgetまで保持する。
                properties:
                  boundAt:
                    description: boundAtはこのHostがこのTalos identityへbindされたことを最初に観測した時刻である。
                    format: date-time
                    type: string
                  clusterID:
                    description: clusterIDはこのHostへinstallされているTalos clusterのIDである。
                    type: string
                  recoverySecretRef:
                    description: recoverySecretRefは短命なTalos API client certificateを再発行できるrecovery
                      Secretをprovider管理namespaceから参照する。
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - clusterID
                - recoverySecretRef
                type: object
              inventory:
                description: HostInventoryはmaintenance Talos discoveryで観測したhardware
                  inventoryである。systemUUIDはidentity evidenceの一つとして扱い、BIOSでの欠落、全て0の値、DIY
                  hardwareでの重複があり得るため単独では信頼しない。
                properties:
                  architecture:
                    type: string
                  bootID:
                    description: bootIDはこのinventoryを取得したTalos kernel bootの識別子である。再起動をまたいだ古いmaintenance
                      endpointの観測を現在のbootと混同しないために使う。
                    type: string
                  disks:
                    items:
                      description: DiskInventoryはHostのraw hardware inventoryから観測したdiskである。
                      properties:
                        busPath:
                          type: string
                        devicePath:
                          type: string
                        model:
                          type: string
                        readOnly:
                          type: boolean
                        rotational:
                          type: boolean
                        serial:
                          type: string
                        sizeBytes:
                          format: int64
                          type: integer
                        stableSelector:
                          description: |-
                            stableSelectorは、このdiskを同じHost上の他のdiskと区別できる最も具体的なTalos CEL disk
                            selectorのpreviewである。install targetの選択が実際に生成するselectorと同じ規則
                            (WWID→serial→bus path→size/rotationalの順)から算出した観測結果であり、ユーザーが
                            TartBootstrapConfigのraw patchでstorage documentのdisk selectorを書く際に、WWID等の
                            生値を読み取って比較する必要がないようにするための参考情報である。他のdiskと区別できない
                            場合は空になる。
                          type: string
                        symlinks:
                          items:
                            type: string
                          type: array
                        transport:
                          type: string
                        wwid:
                          type: string
                      required:
                      - readOnly
                      - rotational
                      - sizeBytes
                      type: object
                    type: array
                  networkInterfaces:
                    items:
                      description: NetworkInterfaceInventoryはHostで観測したnetwork interfaceである。
                      properties:
                        addresses:
                          items:
                            type: string
                          type: array
                        busPath:
                          type: string
                        driver:
                          type: string
                        linkState:
                          type: string
                        macAddress:
                          description: MACAddressは正規化済みのEUI-48を表す値オブジェクトである。ゼロ値は未設定を表す。
                          type: object
                        name:
                          type: string
                      type: object
                    type: array
                  systemUUID:
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
