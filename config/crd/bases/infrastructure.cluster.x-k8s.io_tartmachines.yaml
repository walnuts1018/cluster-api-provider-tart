---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tartmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: TartMachine
    listKind: TartMachineList
    plural: tartmachines
    singular: tartmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Infrastructure provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: Assigned TartHost
      jsonPath: .status.hostRef.name
      name: Host
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              deletionPolicy:
                description: deletionPolicy controls how State and Data are handled
                  when the machine is deleted.
                enum:
                - WipeAll
                - RetainData
                - RetainState
                type: string
              hostSelector:
                description: hostSelector selects TartHosts by label.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: matchLabels selects hosts containing all listed labels.
                    maxProperties: 64
                    type: object
                type: object
              image:
                description: image identifies the digest-pinned OS artifact to install.
                properties:
                  ref:
                    description: ref is a digest-pinned OCI artifact reference.
                    pattern: ^oci://[^@[:space:]]+@sha256:[0-9a-f]{64}$
                    type: string
                required:
                - ref
                type: object
              platformProfile:
                description: platformProfile identifies the versioned platform configuration
                  required by the machine.
                maxLength: 128
                minLength: 1
                type: string
              providerID:
                description: |-
                  providerID must match the provider ID on the corresponding workload cluster Node.
                  This field is managed by the TartMachine controller.
                maxLength: 512
                minLength: 1
                type: string
              updatePolicy:
                default:
                  mode: Replace
                description: updatePolicy selects replacement or experimental in-place
                  updates.
                properties:
                  mode:
                    default: Replace
                    description: mode selects machine replacement or an experimental
                      in-place update.
                    enum:
                    - Replace
                    - InPlace
                    type: string
                type: object
            required:
            - deletionPolicy
            - image
            - platformProfile
            type: object
          status:
            properties:
              activeSlot:
                description: activeSlot is the OS slot currently reported by the host.
                enum:
                - A
                - B
                type: string
              addresses:
                description: addresses contains the addresses reported for the machine.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions represent the current state of the TartMachine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: failureDomain is the failure domain in which the machine
                  was placed.
                maxLength: 256
                minLength: 1
                type: string
              hostRef:
                description: hostRef identifies the TartHost assigned to this machine.
                properties:
                  name:
                    description: name is the name of the referenced resource.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace is the namespace of the referenced resource.
                    minLength: 1
                    type: string
                  uid:
                    description: uid is the immutable UID of the referenced resource.
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              initialization:
                description: initialization provides observations of the TartMachine
                  initialization process.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when machine infrastructure provisioning has completed.
                      Once true, this value must never become false.
                    type: boolean
                type: object
              installedDistributionVersion:
                description: installedDistributionVersion is the Kubernetes distribution
                  version running in activeSlot.
                maxLength: 128
                minLength: 1
                type: string
              installedImageDigest:
                description: installedImageDigest is the digest of the OS artifact
                  running in activeSlot.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              observedGeneration:
                description: observedGeneration is the last spec generation reconciled
                  into status.
                format: int64
                type: integer
              operationRef:
                description: operationRef identifies the current or most recent TartHostOperation.
                properties:
                  name:
                    description: name is the name of the referenced resource.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace is the namespace of the referenced resource.
                    minLength: 1
                    type: string
                  uid:
                    description: uid is the immutable UID of the referenced resource.
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
            type: object
        required:
        - spec
        type: object
