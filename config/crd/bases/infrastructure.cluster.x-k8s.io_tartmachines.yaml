            type: object
          spec:
            description: TartMachineSpecはTartMachineのdesired stateを定義する。field classificationは、hostRefがinitial-onlyかつuser-ownedでclaim後immutable、hostSelectorがinitial-onlyかつuser-ownedでclaim後の変更はsafe-stop、imageがmutableかつUpdate
              Extension-owned lifecycle、providerIDがcontroller-writtenである。
            properties:
              hostRef:
                description: hostRefはTartHostを明示的に選択する(initial-onlyかつuser-owned)。Host
