    - cluster-api
    kind: TartMachineTemplate
    listKind: TartMachineTemplateList
    plural: tartmachinetemplates
    shortNames:
    - tmt
    singular: tartmachinetemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TartMachineTemplateはtartmachinetemplates APIのschemaである。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TartMachineTemplateSpecはTartMachineTemplateのdesired stateを定義する。
            properties:
              template:
                description: TartMachineTemplateResourceはtemplateからTartMachineを作成するためのdataを定義する。
                properties:
                  metadata:
                    description: ObjectMetaは生成されるTartMachineのmetadataへ伝播する。CAPI Machineのmetadataは別途管理される。
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: TartMachineTemplateResourceSpecはtemplateから作成する全ての具体的なMachineで共有できるfieldだけを定義する。Host
                      claimとProviderIDは各TartMachineに割り当てるため、ここでは固定できない。
                    properties:
                      hostSelector:
                        description: hostSelectorは特定のHost名を指定せずallocation対象を絞り込む。
                        properties:
                          architecture:
                            type: string
                          selector:
                            description: |-
                              A label selector is a label query over a set of resources. The result of matchLabels and
                              matchExpressions are ANDed. An empty label selector matches all objects. A null
                              label selector matches no objects.
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector
                                  requirements. The requirements are ANDed.
                                items:
                                  description: |-
                                    A label selector requirement is a selector that contains values, a key, and an operator that
                                    relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector
                                        applies to.
                                      type: string
                                    operator:
                                      description: |-
                                        operator represents a key's relationship to a set of values.
                                        Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: |-
                                        values is an array of string values. If the operator is In or NotIn,
                                        the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                        the values array must be empty. This array is replaced during a strategic
                                        merge patch.
                                      items:
                                        type: string
                                      type: array
                                      x-kubernetes-list-type: atomic
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                                x-kubernetes-list-type: atomic
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: |-
                                  matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                  map is equivalent to an element of matchExpressions, whose key field is "key", the
                                  operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                            x-kubernetes-map-type: atomic
                        type: object
                      image:
                        description: imageはdesired Talos OS versionとsystem extension
                          setを指定する。
                        properties:
                          schematicID:
                            description: schematicIDはImage Factory schematic identifierであり、installされるsystem
                              extension setも決定する。
                            maxLength: 128
                            minLength: 1
                            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                            type: string
                          version:
                            description: |-
                              versionはdesired Talos OS versionである。先頭にvを付けたsemantic versioning(prerelease/build metadataは任意)に従わなければならない。
                              TartはTalos v1.14.0以降の multi-document machine configurationにのみ対応するため、v1.14.0未満は拒否する。
                              このfieldはTartMachineTemplateからも共有されるため、この検証はTartMachineTemplate経由の作成/更新にも適用される。
                            pattern: ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$
                            type: string
                            x-kubernetes-validations:
                            - message: Talos version must be v1.14.0 or later
                              rule: int(self.split('.')[0].substring(1)) > 1 || (int(self.split('.')[0].substring(1))
                                == 1 && int(self.split('.')[1]) >= 14)
                        required:
                        - schematicID
                        - version
                        type: object
                    required:
                    - image
                    type: object
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
