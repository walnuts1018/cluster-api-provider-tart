apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cluster-api-provider-tart-system

namePrefix: cluster-api-provider-tart-

labels:
- includeSelectors: true
  pairs:
    cluster.x-k8s.io/provider: infrastructure-tart

resources:
- ../../crd/infrastructure
- ../../rbac/infrastructure
- ../../manager/infrastructure
- ../../netboot-server
- metrics_service.yaml

patches:
- path: ../manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: infrastructure-controller-manager

replacements:
- source:
    kind: ServiceAccount
    version: v1
    name: infrastructure-controller-manager
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
      name: infrastructure-controller-manager
    fieldPaths:
    - spec.template.spec.serviceAccountName
- source:
    kind: ServiceAccount
    version: v1
    name: netboot-server
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
      name: netboot-server
    fieldPaths:
    - spec.template.spec.serviceAccountName
