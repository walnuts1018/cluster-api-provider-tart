apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cluster-api-provider-tart-system

namePrefix: cluster-api-provider-tart-

labels:
- includeSelectors: true
  pairs:
    cluster.x-k8s.io/provider: infrastructure-tart

resources:
- ../crd
- ../rbac
- ../manager
- metrics_service.yaml

patches:
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

replacements:
- source:
    kind: ServiceAccount
    version: v1
    name: controller-manager
    fieldPath: metadata.name
  targets:
  - select:
      kind: Deployment
    fieldPaths:
    - spec.template.spec.serviceAccountName
