apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../external-bootstrap

images:
- name: controller
  newName: registry.test.walnuts.dev/cluster-api-provider-tart
  newTag: v0.0.1

patches:
- target:
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |-
    - op: add
      path: /spec/template/spec/hostNetwork
      value: true
    - op: add
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirstWithHostNet
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: bootloader
        emptyDir: {}
