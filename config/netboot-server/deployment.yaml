apiVersion: apps/v1
kind: Deployment
metadata:
  name: netboot-server
  namespace: system
  labels:
    control-plane: netboot-server
    app.kubernetes.io/name: cluster-api-provider-tart
    app.kubernetes.io/managed-by: kustomize
    cluster.x-k8s.io/provider: infrastructure-tart
spec:
  selector:
    matchLabels:
      control-plane: netboot-server
      app.kubernetes.io/name: cluster-api-provider-tart
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        control-plane: netboot-server
        app.kubernetes.io/name: cluster-api-provider-tart
        cluster.x-k8s.io/provider: infrastructure-tart
    spec:
      # DHCP(port 67)のbroadcast/replyとProxyDHCPの動作にはnode NICへの直接アクセスが必要なため、hostNetworkで動作させる。controller-managerとは異なりcluster network越しには動かせない。
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # emptyDirはkubeletがroot所有で作成するため、ipxe-loader(non-root UID)がTFTP rootへ書き込めるよう共有groupを設定する。
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: netboot-server
      containers:
      - name: netboot-server
        image: netboot-server:latest
        # advertise-http-base-urlは未設定ならbind addressから自動検出する。discoveryのversion/schematicIDは未設定のTartHost/TartMachine不明MACに対する初回enrollment bootでのみ必要であり、環境ごとに異なるため既定値を持たない。
        # 運用者はDeploymentのenvへTART_NETBOOT_DISCOVERY_TALOS_VERSIONとTART_NETBOOT_DISCOVERY_SCHEMATIC_IDを追加して設定する(未設定でもPodはCrashLoopしない)。
        env:
        - name: TART_NETBOOT_DISCOVERY_TALOS_VERSION
          value: ""
        - name: TART_NETBOOT_DISCOVERY_SCHEMATIC_ID
          value: ""
        - name: TART_NETBOOT_ADVERTISE_HTTP_BASE_URL
          value: ""
        volumeMounts:
        - name: tftp-root
          mountPath: /var/lib/netboot-server/tftp
        securityContext:
          # port 67(DHCP)/69(TFTP)はwell-known portでありCAP_NET_BIND_SERVICEが必要だが、
          # 一部のcontainerd/runc環境ではnon-root UIDに対してambient capabilityが正しく
          # 反映されずbind(2)がpermission deniedになる(確認済みの既知動作)。そのためrootで実行し、
          # capabilityをNET_BIND_SERVICEのみに絞ることで権限を最小化する。
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - "NET_BIND_SERVICE"
            drop:
            - "ALL"
        ports:
        - containerPort: 67
          protocol: UDP
          name: dhcp
        - containerPort: 4011
          protocol: UDP
          name: proxydhcp
        - containerPort: 69
          protocol: UDP
          name: tftp
        - containerPort: 8080
          protocol: TCP
          name: http-boot
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      initContainers:
      - name: ipxe-loader
        # E2E workflowと同じiPXE公式prebuilt binaryを、UEFI PXE(ipxe-x86_64.efi)とlegacy BIOS
        # PXE(undionly.kpxe)それぞれが要求する標準名でTFTP rootへ配置する。
        # renovate: datasource=docker depName=curlimages/curl
        # cluster-api-operatorのimage overrideはreference.ParseNamed(strictにdomainを要求する)で全containerのimageをparseするため、
        # domain省略形だと"repository name must be canonical"でproviderのapplyが失敗する。domainを明示して回避する。
        image: docker.io/curlimages/curl:8.16.0
        args:
        - --fail
        - --location
        - --output
        - /var/lib/netboot-server/tftp/ipxe-x86_64.efi
        - https://boot.ipxe.org/x86_64-efi/ipxe.efi
        - --output
        - /var/lib/netboot-server/tftp/undionly.kpxe
        - https://boot.ipxe.org/undionly.kpxe
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tftp-root
          mountPath: /var/lib/netboot-server/tftp
      volumes:
      - name: tftp-root
        emptyDir: {}
      terminationGracePeriodSeconds: 10
