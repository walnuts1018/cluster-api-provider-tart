apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../external-bootstrap

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: e2e-provisioning-keys
  files:
  - os-artifact-public.pem=generated/os-artifact-public.pem
  - agent-plan-private.pem=generated/agent-plan-private.pem

images:
- name: controller
  newName: ghcr.io/walnuts1018/cluster-api-provider-tart
  newTag: latest

patches:
- target:
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |-
    - op: add
      path: /spec/template/spec/hostNetwork
      value: true
    - op: add
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirstWithHostNet
    - op: add
      path: /spec/template/spec/securityContext/fsGroup
      value: 65532
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --os-artifact-key-id=e2e-os-artifact
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --os-artifact-public-key-file=/etc/tart-e2e/os-artifact-public.pem
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-plan-key-id=e2e-agent-plan
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-plan-private-key-file=/etc/tart-e2e/agent-plan-private.pem
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: e2e-provisioning-keys
        mountPath: /etc/tart-e2e
        readOnly: true
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: e2e-provisioning-keys
        secret:
          secretName: e2e-provisioning-keys
          defaultMode: 0440
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: bootloader
        emptyDir: {}
