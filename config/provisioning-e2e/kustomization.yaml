apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../external-bootstrap

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: e2e-provisioning-keys
  files:
  - os-artifact-public.pem=generated/os-artifact-public.pem
  - agent-plan-private.pem=generated/agent-plan-private.pem
  - agent-artifact-public.pem=generated/agent-artifact-public.pem
  - agent-tls.crt=generated/agent-tls.crt
  - agent-tls.key=generated/agent-tls.key

images:
- name: controller
  newName: registry.test.walnuts.dev/cluster-api-provider-tart
  newTag: e2e

patches:
- target:
    kind: Deployment
    name: controller-manager
    namespace: system
  patch: |-
    - op: add
      path: /spec/template/spec/hostNetwork
      value: true
    - op: add
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirstWithHostNet
    - op: add
      path: /spec/template/spec/securityContext/fsGroup
      value: 65532
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --os-artifact-key-id=e2e-os-artifact
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --os-artifact-public-key-file=/etc/tart-e2e/os-artifact-public.pem
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-plan-key-id=e2e-agent-plan
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-plan-private-key-file=/etc/tart-e2e/agent-plan-private.pem
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-api-bind-address=:8444
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-api-cert-file=/etc/tart-e2e/agent-tls.crt
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-api-key-file=/etc/tart-e2e/agent-tls.key
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-api-url=https://192.168.100.1:8444
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-api-allow-isolated-l2
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-artifact-root=/var/lib/tart-agent-artifact
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-artifact-key-id=e2e-agent-artifact
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-artifact-public-key-file=/etc/tart-e2e/agent-artifact-public.pem
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-artifact-base-url=http://192.168.100.1:8082
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --agent-boot-allow-http
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --ipxe-bind-address=:8082
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: e2e-provisioning-keys
        mountPath: /etc/tart-e2e
        readOnly: true
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: e2e-agent-artifact
        mountPath: /var/lib/tart-agent-artifact
        readOnly: true
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: e2e-provisioning-keys
        secret:
          secretName: e2e-provisioning-keys
          defaultMode: 0440
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: e2e-agent-artifact
        hostPath:
          path: /var/lib/tart-provisioning-e2e/agent-artifact
          type: Directory
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: bootloader
        emptyDir: {}
