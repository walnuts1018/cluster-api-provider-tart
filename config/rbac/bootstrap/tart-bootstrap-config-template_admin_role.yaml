# This rule is not used by the project cluster-api-provider-tart itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over bootstrap.cluster.x-k8s.io/tartbootstrapconfigtemplates.
# This role is intended for users authorized to modify existing cluster roles and bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-tart
    app.kubernetes.io/managed-by: kustomize
  name: tart-bootstrap-config-template-admin-role
rules:
- apiGroups:
  - bootstrap.cluster.x-k8s.io
  resources:
  - tartbootstrapconfigtemplates
  verbs:
  - '*'
- apiGroups:
  - bootstrap.cluster.x-k8s.io
  resources:
  - tartbootstrapconfigtemplates/status
  verbs:
  - get
