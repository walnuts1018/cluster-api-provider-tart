# This rule is not used by the project cluster-api-provider-tart itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the bootstrap.cluster.x-k8s.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage other users' access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-tart
    app.kubernetes.io/managed-by: kustomize
  name: tart-bootstrap-config-template-editor-role
rules:
- apiGroups:
  - bootstrap.cluster.x-k8s.io
  resources:
  - tartbootstrapconfigtemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bootstrap.cluster.x-k8s.io
  resources:
  - tartbootstrapconfigtemplates/status
  verbs:
  - get
