# This rule is not used by the project cluster-api-provider-tart itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over controlplane.cluster.x-k8s.io/tartcontrolplanes.
# This role is intended for users authorized to modify existing cluster roles and bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-tart
    app.kubernetes.io/managed-by: kustomize
  name: tart-control-plane-admin-role
rules:
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - tartcontrolplanes
  verbs:
  - '*'
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - tartcontrolplanes/status
  verbs:
  - get
