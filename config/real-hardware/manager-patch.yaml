apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        tart.walnuts.dev/provisioning-network: "true"
      containers:
      - name: manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --bootstrap-bind-address=0.0.0.0
        - --bootstrap-advertise-address=$(TART_BOOTSTRAP_ADVERTISE_ADDRESS)
        - --tftp-bind-address=:69
        - --ipxe-bind-address=:8082
        - --agent-api-bind-address=:8444
        - --agent-api-cert-file=/etc/tart/credentials/agent-api.crt
        - --agent-api-key-file=/etc/tart/credentials/agent-api.key
        - --agent-api-url=$(TART_AGENT_API_URL)
        - --agent-api-allow-isolated-l2
        - --agent-artifact-root=/var/lib/tart/agent-artifact
        - --agent-artifact-key-id=$(TART_AGENT_ARTIFACT_KEY_ID)
        - --agent-artifact-public-key-file=/etc/tart/credentials/agent-artifact-public.pem
        - --agent-artifact-base-url=$(TART_AGENT_ARTIFACT_BASE_URL)
        - --agent-boot-cert-file=/etc/tart/credentials/agent-api.crt
        - --agent-boot-key-file=/etc/tart/credentials/agent-api.key
        - --os-artifact-key-id=$(TART_OS_ARTIFACT_KEY_ID)
        - --os-artifact-public-key-file=/etc/tart/credentials/os-artifact-public.pem
        - --agent-plan-key-id=$(TART_AGENT_PLAN_KEY_ID)
        - --agent-plan-private-key-file=/etc/tart/credentials/agent-plan-private.pem
        env:
        - name: TART_BOOTSTRAP_ADVERTISE_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: bootstrapAdvertiseAddress
        - name: TART_AGENT_API_URL
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: agentAPIURL
        - name: TART_AGENT_ARTIFACT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: agentArtifactBaseURL
        - name: TART_AGENT_ARTIFACT_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: agentArtifactKeyID
        - name: TART_OS_ARTIFACT_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: osArtifactKeyID
        - name: TART_AGENT_PLAN_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: agentPlanKeyID
        ports:
        - containerPort: 8444
          name: agent-api
          protocol: TCP
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - "ALL"
        volumeMounts:
        - name: provisioning-credentials
          mountPath: /etc/tart/credentials
          readOnly: true
        - name: agent-artifact
          mountPath: /var/lib/tart/agent-artifact
          readOnly: true
      volumes:
      - name: provisioning-credentials
        secret:
          secretName: tart-provisioning-credentials
          defaultMode: 0440
      - name: agent-artifact
        image:
          reference: ghcr.io/walnuts1018/cluster-api-provider-tart-provisioning-agent:latest
          pullPolicy: IfNotPresent
