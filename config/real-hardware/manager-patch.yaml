apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      # init containerとmanagerが共有するemptyDirへ、非rootユーザーのまま書き込めるようにする。
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --bootstrap-bind-address=0.0.0.0
        - --bootstrap-advertise-address=$(TART_PROVISIONING_ADDRESS)
        - --tftp-bind-address=:69
        - --ipxe-bind-address=:8082
        - --agent-api-bind-address=:8444
        - --agent-api-cert-file=/var/run/tart/tls/agent-api.crt
        - --agent-api-key-file=/var/run/tart/tls/agent-api.key
        - --agent-api-url=https://$(TART_PROVISIONING_ADDRESS):8444
        - --agent-api-allow-isolated-l2
        - --agent-artifact-root=/var/lib/tart/agent-artifact
        - --agent-artifact-key-id=$(TART_AGENT_ARTIFACT_KEY_ID)
        - --agent-artifact-public-key-file=/etc/tart/trust/agent-artifact-public.pem
        - --agent-artifact-base-url=http://$(TART_PROVISIONING_ADDRESS):8082
        - --agent-boot-allow-http
        - --os-artifact-key-id=$(TART_OS_ARTIFACT_KEY_ID)
        - --os-artifact-public-key-file=/etc/tart/trust/os-artifact-public.pem
        - --agent-plan-key-id=$(TART_AGENT_PLAN_KEY_ID)
        - --agent-plan-private-key-file=/var/run/tart/credentials/agent-plan-private.pem
        env:
        - name: TART_PROVISIONING_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: TART_AGENT_ARTIFACT_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: agentArtifactKeyID
        - name: TART_OS_ARTIFACT_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: osArtifactKeyID
        - name: TART_AGENT_PLAN_KEY_ID
          valueFrom:
            configMapKeyRef:
              name: tart-provisioning-settings
              key: agentPlanKeyID
        ports:
        - containerPort: 8444
          name: agent-api
          protocol: TCP
        securityContext:
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - "ALL"
        volumeMounts:
        - name: provisioning-credentials
          mountPath: /var/run/tart/credentials
          readOnly: true
        - name: provisioning-trust
          mountPath: /etc/tart/trust
          readOnly: true
        - name: agent-api-tls
          mountPath: /var/run/tart/tls
          readOnly: true
      initContainers:
      - name: credential-init
        image: controller:latest
        command:
        - /credential-init
        - --credentials-dir=/var/run/tart/credentials
        - --tls-dir=/var/run/tart/tls
        env:
        - name: TART_PROVISIONING_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: provisioning-credentials
          mountPath: /var/run/tart/credentials
        - name: agent-api-tls
          mountPath: /var/run/tart/tls
      volumes:
      - name: provisioning-credentials
        emptyDir:
          medium: Memory
      - name: provisioning-trust
        configMap:
          name: provisioning-trust
          defaultMode: 0444
      - name: agent-api-tls
        emptyDir:
          medium: Memory
      - name: agent-artifact
        image:
          reference: ghcr.io/walnuts1018/cluster-api-provider-tart-provisioning-agent:latest
          pullPolicy: IfNotPresent
