apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: TartHost
metadata:
  labels:
    app.kubernetes.io/name: cluster-api-provider-tart
    app.kubernetes.io/managed-by: kustomize
  name: tarthost-sample
spec:
  identifiers:
    systemUUID: 11111111-2222-3333-4444-555555555555
    bootMACAddress: 02:00:00:00:00:01
  architecture: amd64
  firmware: UEFI
  platformProfile: amd64-uefi-ab/v1
  rootDeviceHints:
    deviceName: /dev/disk/by-id/wwn-0x5000000000000001
    wwn: "0x5000000000000001"
    minSizeBytes: 274877906944
  management:
    powerDriver: wol
    bootDriver: ipxe
