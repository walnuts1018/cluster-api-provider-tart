[tools]
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.22.0"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.25.0"
kustomize = "5.8.1"
golangci-lint = "2.13.2"
kind = "0.33.0"
kubebuilder = "4.15.0"
kubectl = "1.37.0"
jq = "1.8.2"
tilt = "0.37.7"
go = "1.27.1"
shellcheck = "0.11.0"
gh = "2.100.0"
devcontainer-cli = "0.89.0"
# E2E labのwol-libvirt-gateway (https://github.com/brunoproduit/wol-libvirt-gateway) をbuildするために使う。
rust = "1.91.1"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go/pkg/mod"

[tasks.help]
description = "開発用taskの一覧を表示する"
run = "mise tasks"

[tasks.fmt]
description = "Goコードをformatする"
run = "gofmt -w $(rg --files -g '*.go' -g '!vendor/**')"

[tasks.generate]
description = "Goの生成コードを生成する"
run = "go generate ./..."

[tasks.manifests]
description = "CRDとRBAC manifestをprovider(bootstrap/control-plane/infrastructure)ごとにcontroller-genで生成する"
run = """
controller-gen object paths=./api/...
controller-gen rbac:roleName=bootstrap-manager-role paths=./controller/tartbootstrapconfig/... output:rbac:artifacts:config=config/rbac/bootstrap
controller-gen rbac:roleName=control-plane-manager-role paths=./controller/tartcontrolplane/... paths=./controller/runtimeextension/... output:rbac:artifacts:config=config/rbac/control-plane
controller-gen rbac:roleName=infrastructure-manager-role paths=./controller/tarthost/... paths=./controller/tartcluster/... paths=./controller/tartmachine/... paths=./controller/talosrecovery/... output:rbac:artifacts:config=config/rbac/infrastructure
"""

[tasks.crd]
description = "CRD manifestをcontroller-genで生成する"
run = "controller-gen crd paths=./api/... output:crd:artifacts:config=config/crd/bases"

[tasks.build]
description = "bootstrap-manager/control-plane-manager/infrastructure-managerをcompileする"
run = """
go build ./cmd/bootstrap-manager
go build ./cmd/control-plane-manager
go build ./cmd/infrastructure-manager
"""

[tasks."build-netboot-server"]
description = "netboot-serverをcompileする"
run = "go build ./cmd/netboot-server"

[tasks.vet]
description = "Goの静的検査を実行する"
run = "go vet ./..."

[tasks.test]
description = "unit/envtestを実行する(test/e2e配下は含まない)"
run = "go test ./..."

[tasks."test-e2e"]
description = "bare-metal lab上のE2Eを実行する(KVM/libvirtが利用可能なLinux runner専用)"
run = "go test -tags e2e -timeout 60m ./test/e2e/..."

[tasks."build-wol-gateway"]
description = "E2E labで使うwol-libvirt-gateway (https://github.com/brunoproduit/wol-libvirt-gateway) をbuildする"
run = """
cargo install --git https://github.com/brunoproduit/wol-libvirt-gateway --locked --root .cache/wol-libvirt-gateway \
  || cargo install --git https://github.com/brunoproduit/wol-libvirt-gateway --root .cache/wol-libvirt-gateway
"""

[tasks."build-golangci-lint"]
description = "Build custom golangci-lint binary with module plugins"
sources = [".custom-gcl.yml"]
outputs = ["bin/custom-gcl"]
run = "golangci-lint custom"

[tasks."golangci-lint"]
description = "Run custom golangci-lint"
depends = ["build-golangci-lint"]
run = "./bin/custom-gcl"

[tasks.lint]
description = "Run all linters"
depends = ["build-golangci-lint"]
run = "./bin/custom-gcl run ./..."

[tasks."lint:fix"]
description = "Run linter and perform fixes"
depends = ["build-golangci-lint"]
run = "./bin/custom-gcl run --fix ./..."

[tasks."release-manifests"]
description = "clusterctl/cluster-api-operator向けのbootstrap/control-plane/infrastructure-components.yaml等を生成する(BOOTSTRAP_MANAGER_IMAGE, CONTROL_PLANE_MANAGER_IMAGE, INFRASTRUCTURE_MANAGER_IMAGE, NETBOOT_SERVER_IMAGEが必須)"
run = "./scripts/release-manifests/run.sh"
