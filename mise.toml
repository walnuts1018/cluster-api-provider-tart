[tools]
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.21.0"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.24.1"
"go:sigs.k8s.io/kustomize/kustomize/v5" = "5.8.1"
kind = "0.32.0"
kubebuilder = "4.15.0"
kubectl = "1.36.3"
jq = "1.8.2"
tilt = "0.37.6"
golangci-lint = "2.12.2"
actionlint = "1.7.12"
go = "1.26.6"
k9s = "0.51.0"
shellcheck = "0.11.0"
gh = "2.97.0"
"npm:@devcontainers/cli" = "0.89.0"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go/pkg/mod"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

[tasks.help]
description = "利用可能な mise task を表示する"
run = "mise tasks"

[tasks.manifests]
description = "CRD と RBAC マニフェストを生成する"
run = '''
# repository内のGo module cacheを生成対象に含めると、依存moduleの開発用go.workまで誤読する。
controller-gen rbac:roleName=manager-role crd webhook \
  paths="./api/...;./cmd/...;./domain/...;./infrastructure/..." \
  output:crd:artifacts:config=config/crd/bases
'''

[tasks.generate]
description = "DeepCopy コードを生成する"
run = '''
# DeepCopy markerを持つAPI packageだけを対象にし、module cacheを走査しない。
controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./api/..."
mise run kessoku
'''

[tasks.kessoku]
description = "kessoku injector を生成する"
run = "go generate ./cmd/kessoku"

[tasks.fmt]
description = "Go コードを go fmt で整形する"
run = "go fmt ./..."

[tasks.vet]
description = "Go コードを go vet で検証する"
run = "go vet ./..."

[tasks.prepare-development]
description = "ローカル開発用の生成・整形・静的検査を実行する"
run = '''
mise run manifests
mise run generate
mise run fmt
mise run vet
'''

[tasks.test]
description = "Go テストを実行する（ローカル開発用）"
depends = ["prepare-development"]
run = '''
LOCALBIN="${LOCALBIN:-$PWD/bin}"
ENVTEST_K8S_VERSION="${ENVTEST_K8S_VERSION:-$(go list -m k8s.io/api | awk '{print $2}' | sed -E 's/^v?[0-9]+\.([0-9]+).*/1.\1/')}"
KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$LOCALBIN" -p path)" \
  go test $(go list ./... | grep -v /e2e) -coverprofile cover.out
'''

[tasks.ci-go-test]
description = "CI 用 Go テスト（生成物・lint・Resource preservation 契約は別に実行する）"
run = '''
LOCALBIN="${LOCALBIN:-$PWD/bin}"
ENVTEST_K8S_VERSION="${ENVTEST_K8S_VERSION:-$(go list -m k8s.io/api | awk '{print $2}' | sed -E 's/^v?[0-9]+\.([0-9]+).*/1.\1/')}"
KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$LOCALBIN" -p path)" \
  go test $(go list ./... | grep -v /e2e) -coverprofile cover.out
'''

[tasks.ci-test]
description = "CI 用テスト（generate/manifests/lint は別ジョブ実行済みのため省略）"
depends = ["test-resource-preservation", "ci-go-test"]

[tasks.test-resource-preservation]
description = "クラスタ更新前後のResource UIDとPVC digest比較契約を検証する"
run = '''
test/resource_preservation/verify_test.sh
test/resource_preservation/collect-snapshot_test.sh
'''

[tasks.test-redfish-contract]
description = "Redfish simulator contract test を実行する"
run = '''
MISE_OFFLINE=1 mise exec -- go test ./infrastructure/service/driver/redfish -run 'Contract' -v
'''

[tasks.setup-test-e2e]
description = "e2e テスト用の Kind クラスタを作成する"
run = '''
KIND_CLUSTER="${KIND_CLUSTER:-cluster-api-provider-tart-test-e2e}"
if kind get clusters | grep -qx "$KIND_CLUSTER"; then
  echo "Kind cluster '$KIND_CLUSTER' already exists. Skipping creation."
else
  echo "Creating Kind cluster '$KIND_CLUSTER'..."
  kind create cluster --name "$KIND_CLUSTER"
fi
'''

[tasks.test-e2e]
description = "Kind を使って e2e テストを実行する"
depends = ["prepare-development"]
run = "bash scripts/kind-e2e-run/script.sh"

[tasks.cleanup-test-e2e]
description = "e2e テスト用の Kind クラスタを削除する"
run = '''
KIND_CLUSTER="${KIND_CLUSTER:-cluster-api-provider-tart-test-e2e}"
kind delete cluster --name "$KIND_CLUSTER"
'''

[tasks."build-golangci-lint"]
description = "カスタム golangci-lint バイナリを用意する"
sources = [".custom-gcl.yml"]
outputs = ["bin/custom-gcl"]
run = "golangci-lint custom"

[tasks."golangci-lint"]
description = "golangci-lint を実行する（ローカル開発用: --fix で自動修正を行う）"
depends = ["build-golangci-lint"]
run = "./bin/custom-gcl"

[tasks.lint]
description = "lintを実行する"
depends = ["lint-workspace"]
run = "mise run golangci-lint run --fix"

[tasks.ci-lint]
description = "CI 用 lint（--fix なし: 自動修正せず lint エラーを検出のみ）"
depends = ["lint-workspace"]
run = "mise run golangci-lint run"

[tasks.lint-workspace]
description = "WorkflowとShell scriptを検証する"
run = '''
mise run actionlint
mise run lint-shell
'''

[tasks.lint-fix]
description = "golangci-lint の自動修正を実行する"
run = '''
mise run golangci-lint run --fix
'''

[tasks.lint-config]
description = "golangci-lint 設定を検証する"
depends = ["build-golangci-lint"]
run = '''
./bin/custom-gcl config verify
'''

[tasks.actionlint]
description = "GitHub Actions workflow を actionlint で検証する"
run = '''
# TODO: actionlint v1.7.12 は公式の steps.parallel 構文を未対応の必須 run/uses エラーとして扱う。
# CI workflow ではその診断だけを除外し、他の workflow は通常どおり厳密に検証する。
find .github/workflows -type f \( -name '*.yaml' -o -name '*.yml' \) ! -name 'ci.yaml' -print0 | xargs -0 actionlint
actionlint -ignore 'step must run script with "run" section or run action with "uses" section' .github/workflows/ci.yaml
'''

[tasks.lint-shell]
description = "repository内のshell scriptをshellcheckで検証する"
run = '''
shellcheck \
  artifact/mkosi/mkosi.extra/usr/libexec/tart/apply-cloud-config \
  artifact/mkosi/mkosi.extra/usr/libexec/tart/first-boot \
  test/resource_preservation/collect-snapshot.sh \
  test/resource_preservation/collect-snapshot_test.sh \
  test/resource_preservation/phase.sh \
  test/fixtures/fake-kubectl \
  test/resource_preservation/verify.sh \
  test/resource_preservation/verify_test.sh
find scripts .github/scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
'''

[tasks.build]
description = "manager、Provisioning Agent、Node Lifecycle Serviceバイナリをビルドする（ローカル開発用）"
depends = ["prepare-development"]
run = '''
mkdir -p bin
go build -o bin/manager ./cmd/controller-manager
go build -o bin/provisioning-agent ./cmd/provisioning-agent
go build -o bin/efi-commit ./cmd/efi-commit
go build -o bin/node-lifecycle-service ./cmd/node-lifecycle-service
'''

[tasks.ci-build]
description = "CI 用ビルドチェック（generate/manifests/fmt/vet は別ジョブ実行済みのため省略）"
depends = [
  "ci-build-manager",
  "ci-build-provisioning-agent",
  "ci-build-efi-commit",
  "ci-build-node-lifecycle-service",
]

[tasks.ci-build-manager]
description = "CI 用 manager バイナリビルド"
run = "mkdir -p bin && go build -o bin/manager ./cmd/controller-manager"

[tasks.ci-build-provisioning-agent]
description = "CI 用 Provisioning Agent バイナリビルド"
run = "mkdir -p bin && go build -o bin/provisioning-agent ./cmd/provisioning-agent"

[tasks.ci-build-efi-commit]
description = "CI 用 EFI commit ツールビルド"
run = "mkdir -p bin && go build -o bin/efi-commit ./cmd/efi-commit"

[tasks.ci-build-node-lifecycle-service]
description = "CI 用 Node Lifecycle Service バイナリビルド"
run = "mkdir -p bin && go build -o bin/node-lifecycle-service ./cmd/node-lifecycle-service"

[tasks.run]
description = "ローカルホストで controller を実行する"
depends = ["prepare-development"]
run = '''
go run ./cmd/controller-manager
'''

[tasks.docker-build]
description = "manager のコンテナイメージをビルドする"
run = '''
IMG="${IMG:-controller:latest}"
CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
"$CONTAINER_TOOL" build -t "$IMG" .
'''

[tasks.docker-push]
description = "manager のコンテナイメージを push する"
run = '''
IMG="${IMG:-controller:latest}"
CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
"$CONTAINER_TOOL" push "$IMG"
'''

[tasks.docker-buildx]
description = "manager のマルチアーキテクチャイメージを buildx でビルドして push する"
run = '''
IMG="${IMG:-controller:latest}"
PLATFORMS="${PLATFORMS:-linux/arm64,linux/amd64,linux/s390x,linux/ppc64le}"
CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
sed -e '1 s/\(^FROM\)/FROM --platform=\${BUILDPLATFORM}/; t' -e ' 1,// s//FROM --platform=\${BUILDPLATFORM}/' Dockerfile > Dockerfile.cross
cleanup() {
  rm -f Dockerfile.cross
  "$CONTAINER_TOOL" buildx rm cluster-api-provider-tart-builder >/dev/null 2>&1 || true
}
trap cleanup EXIT
"$CONTAINER_TOOL" buildx create --name cluster-api-provider-tart-builder
"$CONTAINER_TOOL" buildx use cluster-api-provider-tart-builder
"$CONTAINER_TOOL" buildx build --push --platform="$PLATFORMS" --tag "$IMG" -f Dockerfile.cross .
'''

[tasks.artifact-manifest]
description = "OS/Verity payload から署名済み Artifact Manifest を生成する"
run = '''
: "${ARTIFACT_IMAGE:?ARTIFACT_IMAGE is required}"
: "${ARTIFACT_VERITY:?ARTIFACT_VERITY is required}"
: "${ARTIFACT_VERITY_ROOT_HASH:?ARTIFACT_VERITY_ROOT_HASH is required}"
: "${ARTIFACT_KERNEL:?ARTIFACT_KERNEL is required}"
: "${ARTIFACT_INITRD:?ARTIFACT_INITRD is required}"
: "${ARTIFACT_SIGNING_KEY:?ARTIFACT_SIGNING_KEY is required}"
: "${ARTIFACT_SIGNING_KEY_ID:?ARTIFACT_SIGNING_KEY_ID is required}"
go run ./cmd/artifact-manifest \
  -config "${ARTIFACT_CONFIG:-artifact/config/ubuntu-24.04-amd64-kubeadm.json}" \
  -image "$ARTIFACT_IMAGE" \
  -verity "$ARTIFACT_VERITY" \
  -verity-root-hash "$ARTIFACT_VERITY_ROOT_HASH" \
  -kernel "$ARTIFACT_KERNEL" \
  -initrd "$ARTIFACT_INITRD" \
  -signing-key "$ARTIFACT_SIGNING_KEY" \
  -key-id "$ARTIFACT_SIGNING_KEY_ID" \
  -output-dir "${ARTIFACT_OUTPUT_DIR:-dist/artifact}"
'''

[tasks.artifact-push]
description = "署名済み OS Artifact をOCI registryへ公開してdigest固定参照を出力する"
run = '''
: "${ARTIFACT_REPOSITORY:?ARTIFACT_REPOSITORY is required}"
: "${ARTIFACT_TAG:?ARTIFACT_TAG is required}"
: "${ARTIFACT_IMAGE:?ARTIFACT_IMAGE is required}"
: "${ARTIFACT_VERITY:?ARTIFACT_VERITY is required}"
: "${ARTIFACT_KERNEL:?ARTIFACT_KERNEL is required}"
: "${ARTIFACT_INITRD:?ARTIFACT_INITRD is required}"
: "${ARTIFACT_SBOM:?ARTIFACT_SBOM is required}"
: "${ARTIFACT_PROVENANCE:?ARTIFACT_PROVENANCE is required}"
artifact_output="${ARTIFACT_OUTPUT_DIR:-dist/artifact}"
go run ./cmd/artifact-oci \
  -repository "$ARTIFACT_REPOSITORY" \
  -tag "$ARTIFACT_TAG" \
  -manifest "$artifact_output/manifest.json" \
  -signature "$artifact_output/manifest.signature.json" \
  -image "$ARTIFACT_IMAGE" \
  -verity "$ARTIFACT_VERITY" \
  -kernel "$ARTIFACT_KERNEL" \
  -initrd "$ARTIFACT_INITRD" \
  -sbom "$ARTIFACT_SBOM" \
  -provenance "$ARTIFACT_PROVENANCE"
'''

[tasks.prepare-provisioning-e2e-artifact]
description = "Provisioning E2E用の署名済みOS Artifactとmanager鍵Secret入力を生成する"
run = "bash scripts/provisioning-e2e-prepare-artifact/script.sh"

[tasks.artifact-provenance]
description = "Artifact Manifestとlock fileからSLSA provenanceを生成する"
run = '''
: "${ARTIFACT_SOURCE_URI:?ARTIFACT_SOURCE_URI is required}"
: "${ARTIFACT_SOURCE_REVISION:?ARTIFACT_SOURCE_REVISION is required}"
: "${ARTIFACT_BUILDER_ID:?ARTIFACT_BUILDER_ID is required}"
artifact_output="${ARTIFACT_OUTPUT_DIR:-dist/artifact}"
go run ./cmd/artifact-provenance \
  -manifest "$artifact_output/manifest.json" \
  -lock "${ARTIFACT_LOCK:-artifact/locks/amd64.json}" \
  -source-uri "$ARTIFACT_SOURCE_URI" \
  -source-revision "$ARTIFACT_SOURCE_REVISION" \
  -builder-id "$ARTIFACT_BUILDER_ID" \
  -output "$artifact_output/provenance.intoto.json"
'''

[tasks.artifact-download-inputs]
description = "lock fileで固定したArtifact build入力を取得して検証する"
run = '''
go run ./cmd/locked-download \
  -lock "${ARTIFACT_LOCK:-artifact/locks/amd64.json}" \
  -output-dir artifact/mkosi/mkosi.packages
'''

[tasks.artifact-download-runtime-inputs]
description = "lock fileで固定したNode Lifecycle runtime入力を取得して検証する"
run = '''
go run ./cmd/locked-download \
  -lock "${ETCDCTL_LOCK:-artifact/locks/etcdctl-linux-amd64.json}" \
  -output-dir "${ARTIFACT_RUNTIME_INPUT_DIR:-dist/runtime-inputs}"
'''

[tasks.artifact-build-mkosi]
description = "Artifact設定に対応するOS/Verity payloadをmkosiで生成する（Linux専用）"
depends = ["artifact-download-inputs", "artifact-download-runtime-inputs"]
run = "bash scripts/os-artifact-build-mkosi/script.sh"

[tasks.artifact-test-firstboot-qemu]
description = "mkosi成果物をQEMUで起動しfirst-bootのBootReport到達を検証する（Linux専用）"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "artifact-test-firstboot-qemu requires Linux" >&2
  exit 1
fi
go run ./cmd/os-firstboot-qemu \
  -artifact-dir "${ARTIFACT_OUTPUT_DIR:-dist/os-artifact}" \
  -work-dir "${ARTIFACT_QEMU_WORK_DIR:-dist/os-artifact/qemu-firstboot}" \
  -timeout "${ARTIFACT_QEMU_TIMEOUT:-10m}" \
  -cpu "${ARTIFACT_QEMU_CPU:-qemu64}"
'''

[tasks.artifact-test-boot-trial-metadata-persistence]
description = "boot metadata更新直後の電源断後もboot trial回数が残ることをQEMUで検証する（Linux専用）"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "artifact-test-boot-trial-metadata-persistence requires Linux" >&2
  exit 1
fi
go run ./cmd/os-firstboot-qemu \
  -scenario boot-trial-metadata-persistence \
  -artifact-dir "${ARTIFACT_OUTPUT_DIR:-dist/os-artifact}" \
  -work-dir "${ARTIFACT_BOOTMETA_QEMU_WORK_DIR:-dist/os-artifact/boot-trial-metadata-persistence}" \
  -timeout "${ARTIFACT_QEMU_TIMEOUT:-10m}" \
  -cpu "${ARTIFACT_QEMU_CPU:-qemu64}"
'''

[tasks.artifact-test-bootloader-rollback]
description = "OVMF + systemd-bootで3回失敗後の4回目boot選択をQEMUで検証する（Linux専用）"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "artifact-test-bootloader-rollback requires Linux" >&2
  exit 1
fi
go run ./cmd/os-firstboot-qemu \
  -scenario bootloader-rollback \
  -artifact-dir "${ARTIFACT_OUTPUT_DIR:-dist/os-artifact}" \
  -work-dir "${ARTIFACT_BOOTLOADER_QEMU_WORK_DIR:-dist/os-artifact/bootloader-rollback}" \
  -timeout "${ARTIFACT_QEMU_TIMEOUT:-10m}" \
  -cpu "${ARTIFACT_QEMU_CPU:-qemu64}"
