[tasks.artifact-test-boot-trial-rollback]
description = "boot trial rollback状態機械のCI simulator証跡を生成する"
run = '''
go run ./cmd/boot-trial-rollback-sim \
  -output-dir "${ARTIFACT_BOOT_TRIAL_WORK_DIR:-dist/os-artifact/boot-trial-rollback}"
'''

[tasks.artifact-test-dm-verity]
description = "mkosi成果物のdm-verity検証とblock改変検出を確認する（Linux専用）"
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "artifact-test-dm-verity requires Linux" >&2
  exit 1
fi
: "${ARTIFACT_OUTPUT_DIR:=dist/os-artifact}"
evidence_dir="${ARTIFACT_VERITY_WORK_DIR:-$ARTIFACT_OUTPUT_DIR/dm-verity}"
mkdir -p "$evidence_dir"
data_copy="$evidence_dir/os.img"
hash_copy="$evidence_dir/os.verity"
cp --sparse=always "$ARTIFACT_OUTPUT_DIR/os.img" "$data_copy"
cp --sparse=always "$ARTIFACT_OUTPUT_DIR/os.verity" "$hash_copy"
root_hash="$(tr -d '\n' < "$ARTIFACT_OUTPUT_DIR/verity-root-hash")"
printf '%s\n' "$root_hash" > "$evidence_dir/root-hash.txt"
sha256sum "$data_copy" "$hash_copy" > "$evidence_dir/digests-before.txt"
veritysetup verify "$data_copy" "$hash_copy" "$root_hash" \
  >"$evidence_dir/verify-before.log" 2>&1
printf '!' | dd of="$data_copy" bs=1 seek=4096 conv=notrunc status=none
sha256sum "$data_copy" "$hash_copy" > "$evidence_dir/digests-after.txt"
if veritysetup verify "$data_copy" "$hash_copy" "$root_hash" \
  >"$evidence_dir/verify-after.log" 2>&1; then
  echo "dm-verity verification unexpectedly succeeded after tampering" >&2
  exit 1
fi
'''

[tasks.agent-artifact-virtual-media]
description = "Agent kernel/initrdからRedfish VirtualMedia用ISOを生成する"
run = '''
: "${AGENT_ARTIFACT_KERNEL:?AGENT_ARTIFACT_KERNEL is required}"
: "${AGENT_ARTIFACT_INITRD:?AGENT_ARTIFACT_INITRD is required}"
: "${AGENT_ARTIFACT_CONTROLLER_URL:?AGENT_ARTIFACT_CONTROLLER_URL is required}"
: "${AGENT_ARTIFACT_TRUST_URL:?AGENT_ARTIFACT_TRUST_URL is required}"
: "${AGENT_ARTIFACT_HOST_UID:?AGENT_ARTIFACT_HOST_UID is required}"
: "${AGENT_ARTIFACT_OPERATION_UID:?AGENT_ARTIFACT_OPERATION_UID is required}"
: "${AGENT_ARTIFACT_BOOT_MAC:?AGENT_ARTIFACT_BOOT_MAC is required}"
agent_output="${AGENT_ARTIFACT_OUTPUT_DIR:-dist/agent-artifact}"
mkdir -p "$agent_output"
go run ./cmd/agent-artifact-iso \
  -kernel "$AGENT_ARTIFACT_KERNEL" \
  -initrd "$AGENT_ARTIFACT_INITRD" \
  -output "$agent_output/virtual-media.iso" \
  -controller-url "$AGENT_ARTIFACT_CONTROLLER_URL" \
  -trust-url "$AGENT_ARTIFACT_TRUST_URL" \
  -host-uid "$AGENT_ARTIFACT_HOST_UID" \
  -operation-uid "$AGENT_ARTIFACT_OPERATION_UID" \
  -boot-mac "$AGENT_ARTIFACT_BOOT_MAC"
'''

[tasks.agent-artifact-manifest]
description = "Agent Artifact manifestと署名を生成する"
run = '''
: "${AGENT_ARTIFACT_REFERENCE:?AGENT_ARTIFACT_REFERENCE is required}"
: "${AGENT_ARTIFACT_KERNEL:?AGENT_ARTIFACT_KERNEL is required}"
: "${AGENT_ARTIFACT_INITRD:?AGENT_ARTIFACT_INITRD is required}"
: "${AGENT_ARTIFACT_SIGNING_KEY:?AGENT_ARTIFACT_SIGNING_KEY is required}"
: "${AGENT_ARTIFACT_SIGNING_KEY_ID:?AGENT_ARTIFACT_SIGNING_KEY_ID is required}"
agent_output="${AGENT_ARTIFACT_OUTPUT_DIR:-dist/agent-artifact}"
mkdir -p "$agent_output"
if [ -f "$agent_output/virtual-media.iso" ]; then
  set -- -virtual-media "$agent_output/virtual-media.iso"
else
  set --
fi
go run ./cmd/agent-artifact-manifest \
  -reference "$AGENT_ARTIFACT_REFERENCE" \
  -kernel "$AGENT_ARTIFACT_KERNEL" \
  -initrd "$AGENT_ARTIFACT_INITRD" \
  "$@" \
  -signing-key "$AGENT_ARTIFACT_SIGNING_KEY" \
  -key-id "$AGENT_ARTIFACT_SIGNING_KEY_ID" \
  -output-dir "$agent_output"
'''

