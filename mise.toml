[tools]
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.21.0"
"go:github.com/google/wire/cmd/wire" = "0.7.0"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "0.24.1"
"go:sigs.k8s.io/kustomize/kustomize/v5" = "5.8.1"
kind = "0.32.0"
kubebuilder = "4.15.0"
kubectl = "1.36.2"
jq = "1.8.2"
tilt = "0.37.5"
golangci-lint = "2.12.2"
actionlint = "1.7.12"
go = "1.26.5"
k9s = "0.51.0"
shellcheck = "0.11.0"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOMODCACHE = "{{config_root}}/.cache/go/pkg/mod"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

[tasks.all]
description = "デフォルトのビルド処理を実行する"
run = "mise run build"

[tasks.help]
description = "利用可能な mise task を表示する"
run = "mise tasks"

[tasks.manifests]
description = "CRD と RBAC マニフェストを生成する"
run = 'controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases'

[tasks.generate]
description = "DeepCopy コードを生成する"
run = '''
controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."
mise run wire
'''

[tasks.wire]
description = "wire injector を生成する"
run = "(cd cmd/wire && wire)"

[tasks.fmt]
description = "Go コードを go fmt で整形する"
run = "go fmt ./..."

[tasks.vet]
description = "Go コードを go vet で検証する"
run = "go vet ./..."

[tasks.test]
description = "Go テストを実行する（ローカル開発用: manifests/generate/fmt/vet を含む）"
run = '''
mise run manifests
mise run generate
mise run fmt
mise run vet
LOCALBIN="${LOCALBIN:-$PWD/bin}"
ENVTEST_K8S_VERSION="${ENVTEST_K8S_VERSION:-$(go list -m k8s.io/api | awk '{print $2}' | sed -E 's/^v?[0-9]+\.([0-9]+).*/1.\1/')}"
KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$LOCALBIN" -p path)" \
  go test $(go list ./... | grep -v /e2e) -coverprofile cover.out
'''

[tasks.ci-test]
description = "CI 用テスト（generate/manifests/fmt/vet は別ジョブ実行済みのため省略）"
run = '''
mise run test-resource-preservation
LOCALBIN="${LOCALBIN:-$PWD/bin}"
ENVTEST_K8S_VERSION="${ENVTEST_K8S_VERSION:-$(go list -m k8s.io/api | awk '{print $2}' | sed -E 's/^v?[0-9]+\.([0-9]+).*/1.\1/')}"
KUBEBUILDER_ASSETS="$(setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$LOCALBIN" -p path)" \
  go test $(go list ./... | grep -v /e2e) -coverprofile cover.out
'''

[tasks.test-resource-preservation]
description = "クラスタ更新前後のResource UIDとPVC digest比較契約を検証する"
run = '''
hack/verify-resource-preservation_test.sh
hack/collect-resource-preservation-snapshot_test.sh
'''

[tasks.test-redfish-contract]
description = "Redfish simulator contract test を実行する"
run = '''
MISE_OFFLINE=1 mise exec -- go test ./internal/adapter/driver/redfish -run 'Contract' -v
'''

[tasks.setup-test-e2e]
description = "e2e テスト用の Kind クラスタを作成する"
run = '''
KIND_CLUSTER="${KIND_CLUSTER:-cluster-api-provider-tart-test-e2e}"
if kind get clusters | grep -qx "$KIND_CLUSTER"; then
  echo "Kind cluster '$KIND_CLUSTER' already exists. Skipping creation."
else
  echo "Creating Kind cluster '$KIND_CLUSTER'..."
  kind create cluster --name "$KIND_CLUSTER"
fi
'''

[tasks.test-e2e]
description = "Kind を使って e2e テストを実行する"
run = '''
mise run setup-test-e2e
mise run manifests
mise run generate
mise run fmt
mise run vet
KIND_CLUSTER="${KIND_CLUSTER:-cluster-api-provider-tart-test-e2e}"
KIND=kind KIND_CLUSTER="$KIND_CLUSTER" go test -tags=e2e ./test/e2e/ -v -ginkgo.v
mise run cleanup-test-e2e
'''

[tasks.cleanup-test-e2e]
description = "e2e テスト用の Kind クラスタを削除する"
run = '''
KIND_CLUSTER="${KIND_CLUSTER:-cluster-api-provider-tart-test-e2e}"
kind delete cluster --name "$KIND_CLUSTER"
'''

[tasks.ensure-custom-golangci-lint]
description = "カスタム golangci-lint バイナリを用意する"
run = '''
mkdir -p bin
if [ -f .custom-gcl.yml ] && [ ! -x bin/golangci-lint ]; then
  echo "Building custom golangci-lint with plugins..."
  golangci-lint custom --destination bin --name golangci-lint-custom
  mv -f bin/golangci-lint-custom bin/golangci-lint
fi
'''

[tasks.lint]
description = "golangci-lint を実行する（ローカル開発用: --fix で自動修正を行う）"
run = '''
mise run ensure-custom-golangci-lint
if [ -x bin/golangci-lint ]; then
  bin/golangci-lint run --fix
else
  golangci-lint run --fix
fi
mise run actionlint
mise run lint-shell
'''

[tasks.ci-lint]
description = "CI 用 lint（--fix なし: 自動修正せず lint エラーを検出のみ）"
run = '''
mise run ensure-custom-golangci-lint
if [ -x bin/golangci-lint ]; then
  bin/golangci-lint run
else
  golangci-lint run
fi
mise run actionlint
mise run lint-shell
'''

[tasks.lint-fix]
description = "golangci-lint の自動修正を実行する"
run = '''
mise run ensure-custom-golangci-lint
if [ -x bin/golangci-lint ]; then
  bin/golangci-lint run --fix
else
  golangci-lint run --fix
fi
'''

[tasks.lint-config]
description = "golangci-lint 設定を検証する"
run = '''
mise run ensure-custom-golangci-lint
if [ -x bin/golangci-lint ]; then
  bin/golangci-lint config verify
else
  golangci-lint config verify
fi
'''

[tasks.actionlint]
description = "GitHub Actions workflow を actionlint で検証する"
run = "actionlint"

[tasks.lint-shell]
description = "repository内のshell scriptをshellcheckで検証する"
run = '''
shellcheck \
  artifact/mkosi/mkosi.extra/usr/libexec/tart/apply-cloud-config \
  artifact/mkosi/mkosi.extra/usr/libexec/tart/first-boot \
  hack/collect-resource-preservation-snapshot.sh \
  hack/collect-resource-preservation-snapshot_test.sh \
  hack/resource-preservation-phase.sh \
  hack/testdata/fake-kubectl \
  hack/verify-resource-preservation.sh \
  hack/verify-resource-preservation_test.sh
'''

[tasks.build]
description = "manager、Provisioning Agent、Node Lifecycle Serviceバイナリをビルドする（ローカル開発用: manifests/generate/fmt/vet を含む）"
run = '''
mise run manifests
mise run generate
mise run fmt
mise run vet
mkdir -p bin
go build -o bin/manager cmd/main.go
go build -o bin/provisioning-agent ./cmd/provisioning-agent
go build -o bin/node-lifecycle-service ./cmd/node-lifecycle-service
'''

[tasks.ci-build]
description = "CI 用ビルドチェック（generate/manifests/fmt/vet は別ジョブ実行済みのため省略）"
run = '''
mkdir -p bin
go build -o bin/manager cmd/main.go
go build -o bin/provisioning-agent ./cmd/provisioning-agent
go build -o bin/node-lifecycle-service ./cmd/node-lifecycle-service
'''

[tasks.run]
description = "ローカルホストで controller を実行する"
run = '''
mise run manifests
mise run generate
mise run fmt
mise run vet
go run ./cmd/main.go
'''

[tasks.docker-build]
description = "manager のコンテナイメージをビルドする"
run = '''
IMG="${IMG:-controller:latest}"
CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
"$CONTAINER_TOOL" build -t "$IMG" .
'''

[tasks.docker-push]
description = "manager のコンテナイメージを push する"
run = '''
IMG="${IMG:-controller:latest}"
CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
"$CONTAINER_TOOL" push "$IMG"
'''

[tasks.docker-buildx]
description = "manager のマルチアーキテクチャイメージを buildx でビルドして push する"
run = '''
IMG="${IMG:-controller:latest}"
PLATFORMS="${PLATFORMS:-linux/arm64,linux/amd64,linux/s390x,linux/ppc64le}"
CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
sed -e '1 s/\(^FROM\)/FROM --platform=\${BUILDPLATFORM}/; t' -e ' 1,// s//FROM --platform=\${BUILDPLATFORM}/' Dockerfile > Dockerfile.cross
cleanup() {
  rm -f Dockerfile.cross
  "$CONTAINER_TOOL" buildx rm cluster-api-provider-tart-builder >/dev/null 2>&1 || true
}
trap cleanup EXIT
"$CONTAINER_TOOL" buildx create --name cluster-api-provider-tart-builder
"$CONTAINER_TOOL" buildx use cluster-api-provider-tart-builder
"$CONTAINER_TOOL" buildx build --push --platform="$PLATFORMS" --tag "$IMG" -f Dockerfile.cross .
'''

[tasks.docker-build-ipxe]
description = "iPXE binaries をダウンロードして local に取り出す"
run = '''
mkdir -p dist/ipxe
go run ./hack/locked-download -lock artifact/ipxe.lock.json -output-dir /tmp
rm -rf /tmp/ipxeboot
tar xzf /tmp/ipxeboot.tar.gz -C /tmp
cp /tmp/ipxeboot/x86_64/ipxe.efi dist/ipxe/ipxe-x86_64.efi
cp /tmp/ipxeboot/arm64/ipxe.efi dist/ipxe/ipxe-arm64.efi
cp /tmp/ipxeboot/x86_64/undionly.kpxe dist/ipxe/undionly.kpxe
rm -rf /tmp/ipxeboot /tmp/ipxeboot.tar.gz
'''

[tasks.docker-push-ipxe]
description = "iPXE artifact を ORAS を使って push する"
run = '''
IPXE_IMG="${IPXE_IMG:-ghcr.io/walnuts1018/cluster-api-provider-tart-ipxe}"
IPXE_TAG="${IPXE_TAG:-latest}"
go run hack/artifacter/main.go -dir dist/ipxe -repo "$IPXE_IMG" -tag "$IPXE_TAG"
'''

[tasks.artifact-manifest]
description = "OS/Verity payload から署名済み Artifact Manifest を生成する"
run = '''
: "${ARTIFACT_IMAGE:?ARTIFACT_IMAGE is required}"
: "${ARTIFACT_VERITY:?ARTIFACT_VERITY is required}"
: "${ARTIFACT_VERITY_ROOT_HASH:?ARTIFACT_VERITY_ROOT_HASH is required}"
: "${ARTIFACT_KERNEL:?ARTIFACT_KERNEL is required}"
: "${ARTIFACT_INITRD:?ARTIFACT_INITRD is required}"
: "${ARTIFACT_SIGNING_KEY:?ARTIFACT_SIGNING_KEY is required}"
: "${ARTIFACT_SIGNING_KEY_ID:?ARTIFACT_SIGNING_KEY_ID is required}"
go run ./hack/artifact-manifest \
  -config "${ARTIFACT_CONFIG:-artifact/config/ubuntu-24.04-amd64.json}" \
  -image "$ARTIFACT_IMAGE" \
  -verity "$ARTIFACT_VERITY" \
  -verity-root-hash "$ARTIFACT_VERITY_ROOT_HASH" \
  -kernel "$ARTIFACT_KERNEL" \
  -initrd "$ARTIFACT_INITRD" \
  -signing-key "$ARTIFACT_SIGNING_KEY" \
  -key-id "$ARTIFACT_SIGNING_KEY_ID" \
  -output-dir "${ARTIFACT_OUTPUT_DIR:-dist/artifact}"
'''

[tasks.artifact-push]
description = "署名済み OS Artifact をOCI registryへ公開してdigest固定参照を出力する"
run = '''
: "${ARTIFACT_REPOSITORY:?ARTIFACT_REPOSITORY is required}"
: "${ARTIFACT_TAG:?ARTIFACT_TAG is required}"
: "${ARTIFACT_IMAGE:?ARTIFACT_IMAGE is required}"
: "${ARTIFACT_VERITY:?ARTIFACT_VERITY is required}"
: "${ARTIFACT_KERNEL:?ARTIFACT_KERNEL is required}"
: "${ARTIFACT_INITRD:?ARTIFACT_INITRD is required}"
: "${ARTIFACT_SBOM:?ARTIFACT_SBOM is required}"
: "${ARTIFACT_PROVENANCE:?ARTIFACT_PROVENANCE is required}"
artifact_output="${ARTIFACT_OUTPUT_DIR:-dist/artifact}"
go run ./hack/artifact-oci \
  -repository "$ARTIFACT_REPOSITORY" \
  -tag "$ARTIFACT_TAG" \
  -manifest "$artifact_output/manifest.json" \
  -signature "$artifact_output/manifest.signature.json" \
  -image "$ARTIFACT_IMAGE" \
  -verity "$ARTIFACT_VERITY" \
  -kernel "$ARTIFACT_KERNEL" \
  -initrd "$ARTIFACT_INITRD" \
  -sbom "$ARTIFACT_SBOM" \
  -provenance "$ARTIFACT_PROVENANCE"
'''

[tasks.prepare-provisioning-e2e-artifact]
description = "Provisioning E2E用の署名済みOS Artifactとmanager鍵Secret入力を生成する"
run = '''
set -eu

CONTAINER_TOOL="${CONTAINER_TOOL:-docker}"
registry_name="${PROVISIONING_E2E_REGISTRY_NAME:-capt-e2e-registry-55000}"
registry_host="${PROVISIONING_E2E_REGISTRY_HOST:-127.0.0.1:55000}"
output_dir="${PROVISIONING_E2E_OUTPUT_DIR:-dist/provisioning-e2e}"
generated_dir="config/provisioning-e2e/generated"
artifact_dir="$output_dir/artifact"
agent_artifact_dir="$generated_dir/agent-artifact"
agent_initramfs_dir="$output_dir/agent-initramfs"

if ! "$CONTAINER_TOOL" container inspect "$registry_name" >/dev/null 2>&1; then
  "$CONTAINER_TOOL" run -d -p "${registry_host#*:}:5000" --restart=always --name "$registry_name" registry:2 >/dev/null
elif ! "$CONTAINER_TOOL" ps --filter "name=$registry_name" --filter "status=running" --quiet | grep -q .; then
  "$CONTAINER_TOOL" start "$registry_name" >/dev/null
fi

mkdir -p "$output_dir" "$generated_dir" "$artifact_dir" "$agent_artifact_dir"
if [ ! -f "$output_dir/os-artifact-private.pem" ]; then
  openssl genpkey -algorithm Ed25519 -out "$output_dir/os-artifact-private.pem"
fi
if [ ! -f "$generated_dir/os-artifact-public.pem" ]; then
  openssl pkey -in "$output_dir/os-artifact-private.pem" -pubout -out "$generated_dir/os-artifact-public.pem"
fi
if [ ! -f "$generated_dir/agent-plan-private.pem" ]; then
  openssl genpkey -algorithm Ed25519 -out "$generated_dir/agent-plan-private.pem"
fi
openssl pkey \
  -in "$generated_dir/agent-plan-private.pem" \
  -pubout \
  -out "$output_dir/agent-plan-public.pem"
if [ ! -f "$output_dir/agent-artifact-private.pem" ]; then
  openssl genpkey -algorithm Ed25519 -out "$output_dir/agent-artifact-private.pem"
fi
openssl pkey \
  -in "$output_dir/agent-artifact-private.pem" \
  -pubout \
  -out "$generated_dir/agent-artifact-public.pem"
openssl req \
  -x509 \
  -newkey rsa:2048 \
  -sha256 \
  -nodes \
  -days 1 \
  -subj "/CN=192.168.100.1" \
  -addext "subjectAltName=IP:192.168.100.1,DNS:hoge.test.walnuts.dev" \
  -keyout "$generated_dir/agent-tls.key" \
  -out "$generated_dir/agent-tls.crt"

printf 'provisioning e2e os image\n' > "$output_dir/os.img"
printf 'provisioning e2e verity\n' > "$output_dir/os.verity"
printf 'provisioning e2e kernel\n' > "$output_dir/vmlinuz"
printf 'provisioning e2e initrd\n' > "$output_dir/initrd"
printf '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,"components":[]}\n' > "$output_dir/sbom.cdx.json"
printf '{"_type":"https://in-toto.io/Statement/v1","subject":[],"predicateType":"https://slsa.dev/provenance/v1","predicate":{}}\n' > "$output_dir/provenance.intoto.json"

agent_kernel="${PROVISIONING_E2E_AGENT_KERNEL:-}"
agent_base_initrd="${PROVISIONING_E2E_AGENT_INITRD:-}"
if [ -z "$agent_kernel" ]; then
  agent_kernel="$(ls -1 /boot/vmlinuz-* 2>/dev/null | sort -V | tail -n 1 || true)"
fi
if [ -z "$agent_base_initrd" ] && [ -n "$agent_kernel" ]; then
  kernel_version="${agent_kernel##*/vmlinuz-}"
  if [ -f "/boot/initrd.img-$kernel_version" ]; then
    agent_base_initrd="/boot/initrd.img-$kernel_version"
  fi
fi
if [ ! -f "$agent_kernel" ] || [ ! -f "$agent_base_initrd" ]; then
  echo "Linux kernel and initrd are required for provisioning E2E Agent Artifact." >&2
  echo "Set PROVISIONING_E2E_AGENT_KERNEL and PROVISIONING_E2E_AGENT_INITRD, or install linux-image-generic." >&2
  exit 1
fi
busybox_path="${PROVISIONING_E2E_BUSYBOX:-$(command -v busybox || true)}"
if [ ! -x "$busybox_path" ]; then
  echo "busybox is required for provisioning E2E Agent Artifact initramfs." >&2
  echo "Set PROVISIONING_E2E_BUSYBOX, or install busybox-static." >&2
  exit 1
fi

CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$output_dir/provisioning-agent" ./cmd/provisioning-agent
rm -rf "$agent_initramfs_dir"
mkdir -p \
  "$agent_initramfs_dir/bin" \
  "$agent_initramfs_dir/dev" \
  "$agent_initramfs_dir/etc/tart" \
  "$agent_initramfs_dir/proc" \
  "$agent_initramfs_dir/sys" \
  "$agent_initramfs_dir/tmp"
cp "$output_dir/provisioning-agent" "$agent_initramfs_dir/bin/provisioning-agent"
cp "$busybox_path" "$agent_initramfs_dir/bin/busybox"
for applet in sh mount mkdir cat ln poweroff halt sleep udhcpc ifconfig route; do
  ln -sf busybox "$agent_initramfs_dir/bin/$applet"
done
cp "$output_dir/agent-plan-public.pem" "$agent_initramfs_dir/etc/tart/agent-plan-public.pem"
cp "$generated_dir/agent-tls.crt" "$agent_initramfs_dir/etc/tart/agent-tls.crt"
cat > "$agent_initramfs_dir/bin/udhcpc-script" <<'UDHCPC'
#!/bin/sh
set -eu

case "${1:-}" in
  bound|renew)
    ifconfig "$interface" "$ip" netmask "$subnet" up
    if [ -n "${router:-}" ]; then
      for gateway in $router; do
        route add default gw "$gateway" dev "$interface" || true
        break
      done
    fi
    if [ -n "${dns:-}" ]; then
      : > /etc/resolv.conf
      for nameserver in $dns; do
        echo "nameserver $nameserver" >> /etc/resolv.conf
      done
    fi
    ;;
esac
UDHCPC
cat > "$agent_initramfs_dir/init" <<'INIT'
#!/bin/sh
set -eu

PATH=/bin:/sbin:/usr/bin:/usr/sbin
export PATH

mount -t proc proc /proc
mount -t sysfs sysfs /sys
mount -t devtmpfs devtmpfs /dev
mkdir -p /dev/disk/by-id /etc /run /tmp

for iface in /sys/class/net/*; do
  iface="${iface##*/}"
  [ "$iface" != "lo" ] || continue
  ifconfig "$iface" up || true
  udhcpc -i "$iface" -q -n -t 5 -T 3 -s /bin/udhcpc-script || true
done

for device in /sys/class/block/*; do
  name="${device##*/}"
  serial="$(cat "$device/device/serial" 2>/dev/null || cat "$device/serial" 2>/dev/null || true)"
  [ -n "$serial" ] || continue
  ln -sf "../../$name" "/dev/disk/by-id/virtio-$serial"
done

system_uuid=""
for arg in $(cat /proc/cmdline); do
  case "$arg" in
    tart.agent.host-uid=*)
      system_uuid="${arg#tart.agent.host-uid=}"
      ;;
  esac
done

echo "tart e2e provisioning-agent preflight starting"
/bin/provisioning-agent \
  --preflight-only \
  --system-uuid="$system_uuid" \
  --tls-ca-file=/etc/tart/agent-tls.crt \
  --plan-key-id=e2e-agent-plan \
  --plan-key-file=/etc/tart/agent-plan-public.pem
echo "tart e2e provisioning-agent preflight completed"

poweroff -f || halt -f || sh
INIT
chmod 0755 "$agent_initramfs_dir/init"
chmod 0755 "$agent_initramfs_dir/bin/udhcpc-script"
sudo cat "$agent_kernel" > "$agent_artifact_dir/vmlinuz"
sudo cat "$agent_base_initrd" > "$agent_artifact_dir/initrd"
(cd "$agent_initramfs_dir" && find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9) >> "$agent_artifact_dir/initrd"

ARTIFACT_IMAGE="$output_dir/os.img" \
ARTIFACT_VERITY="$output_dir/os.verity" \
ARTIFACT_KERNEL="$output_dir/vmlinuz" \
ARTIFACT_INITRD="$output_dir/initrd" \
ARTIFACT_VERITY_ROOT_HASH="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
ARTIFACT_SIGNING_KEY="$output_dir/os-artifact-private.pem" \
ARTIFACT_SIGNING_KEY_ID="e2e-os-artifact" \
ARTIFACT_OUTPUT_DIR="$artifact_dir" \
  mise run artifact-manifest

artifact_ref="$(
  ARTIFACT_REPOSITORY="$registry_host/tart/ubuntu" \
  ARTIFACT_TAG="e2e" \
  ARTIFACT_IMAGE="$output_dir/os.img" \
  ARTIFACT_VERITY="$output_dir/os.verity" \
  ARTIFACT_KERNEL="$output_dir/vmlinuz" \
  ARTIFACT_INITRD="$output_dir/initrd" \
  ARTIFACT_SBOM="$output_dir/sbom.cdx.json" \
  ARTIFACT_PROVENANCE="$output_dir/provenance.intoto.json" \
  ARTIFACT_OUTPUT_DIR="$artifact_dir" \
    mise run artifact-push | tail -n 1
)"

AGENT_ARTIFACT_REFERENCE="oci://$registry_host/tart/provisioning-agent@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" \
AGENT_ARTIFACT_KERNEL="$agent_artifact_dir/vmlinuz" \
AGENT_ARTIFACT_INITRD="$agent_artifact_dir/initrd" \
AGENT_ARTIFACT_SIGNING_KEY="$output_dir/agent-artifact-private.pem" \
AGENT_ARTIFACT_SIGNING_KEY_ID="e2e-agent-artifact" \
AGENT_ARTIFACT_OUTPUT_DIR="$agent_artifact_dir" \
  mise run agent-artifact-manifest

{
  printf 'OS_ARTIFACT_REF=%s\n' "$artifact_ref"
  printf 'OS_ARTIFACT_REGISTRY=%s\n' "$registry_host"
} > "$output_dir/env"
'''

[tasks.artifact-provenance]
description = "Artifact Manifestとlock fileからSLSA provenanceを生成する"
run = '''
: "${ARTIFACT_SOURCE_URI:?ARTIFACT_SOURCE_URI is required}"
: "${ARTIFACT_SOURCE_REVISION:?ARTIFACT_SOURCE_REVISION is required}"
: "${ARTIFACT_BUILDER_ID:?ARTIFACT_BUILDER_ID is required}"
artifact_output="${ARTIFACT_OUTPUT_DIR:-dist/artifact}"
go run ./hack/artifact-provenance \
  -manifest "$artifact_output/manifest.json" \
  -lock "${ARTIFACT_LOCK:-artifact/locks/ubuntu-24.04-amd64.json}" \
  -source-uri "$ARTIFACT_SOURCE_URI" \
  -source-revision "$ARTIFACT_SOURCE_REVISION" \
  -builder-id "$ARTIFACT_BUILDER_ID" \
  -output "$artifact_output/provenance.intoto.json"
'''

[tasks.artifact-download-inputs]
description = "lock fileで固定したArtifact build入力を取得して検証する"
run = '''
go run ./hack/locked-download \
  -lock "${ARTIFACT_LOCK:-artifact/locks/ubuntu-24.04-amd64.json}" \
  -output-dir artifact/mkosi/mkosi.packages
'''

[tasks.artifact-download-runtime-inputs]
description = "lock fileで固定したNode Lifecycle runtime入力を取得して検証する"
run = '''
go run ./hack/locked-download \
  -lock "${ETCDCTL_LOCK:-artifact/locks/etcdctl-3.6.8-linux-amd64.json}" \
  -output-dir "${ARTIFACT_RUNTIME_INPUT_DIR:-dist/runtime-inputs}"
'''

[tasks.artifact-build-mkosi]
description = "mkosiでUbuntu OS/Verity payloadを生成する（Linux専用）"
depends = ["artifact-download-inputs", "artifact-download-runtime-inputs"]
run = '''
if [ "$(uname -s)" != Linux ]; then
  echo "artifact-build-mkosi requires Linux" >&2
  exit 1
fi
lock="${ARTIFACT_LOCK:-artifact/locks/ubuntu-24.04-amd64.json}"
snapshot="$(jq -er '.ubuntuSnapshot' "$lock")"
source_date_epoch="$(jq -er '.sourceDateEpoch' "$lock")"
snapshot_base="https://snapshot.ubuntu.com/ubuntu/$snapshot/dists"
extra_dir="artifact/mkosi/mkosi.extra"
runtime_input_dir="${ARTIFACT_RUNTIME_INPUT_DIR:-dist/runtime-inputs}"
mkdir -p "$extra_dir/usr/bin"
CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$extra_dir/usr/bin/provisioning-agent" ./cmd/provisioning-agent
CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$extra_dir/usr/bin/node-lifecycle-service" ./cmd/node-lifecycle-service
tar \
  --extract \
  --gzip \
  --file "$runtime_input_dir/etcd-v3.6.8-linux-amd64.tar.gz" \
  --strip-components=1 \
  --to-stdout \
  etcd-v3.6.8-linux-amd64/etcdctl >"$extra_dir/usr/bin/etcdctl"
chmod 0755 "$extra_dir/usr/bin/etcdctl"
tar \
  --extract \
  --gzip \
  --file "$runtime_input_dir/etcd-v3.6.8-linux-amd64.tar.gz" \
  --strip-components=1 \
  --to-stdout \
  etcd-v3.6.8-linux-amd64/etcdutl >"$extra_dir/usr/bin/etcdutl"
chmod 0755 "$extra_dir/usr/bin/etcdutl"
# build contextへ一時配置したbinaryをsource treeへ残さない。
trap 'rm -f "$extra_dir/usr/bin/provisioning-agent" "$extra_dir/usr/bin/node-lifecycle-service" "$extra_dir/usr/bin/etcdctl" "$extra_dir/usr/bin/etcdutl"' EXIT
for suite in noble noble-updates noble-security; do
  available=0
  for delay in 0 1 2; do
    if [ "$delay" -gt 0 ]; then
      sleep "$delay"
    fi
    if curl --fail --silent --show-error --head --location --max-time 30 \
      "$snapshot_base/$suite/InRelease" >/dev/null; then
      available=1
      break
    fi
  done
  if [ "$available" -ne 1 ]; then
    echo "Ubuntu snapshot is unavailable: $snapshot_base/$suite/InRelease" >&2
    exit 1
  fi
done
mkosi \
  --directory artifact/mkosi \
  --snapshot "$snapshot" \
  --source-date-epoch "$source_date_epoch" \
  build
bash artifact/mkosi/normalize-output.sh \
  artifact/mkosi/mkosi.output \
  "${ARTIFACT_OUTPUT_DIR:-dist/os-artifact}"
go run ./hack/mkosi-sbom \
  -input "${ARTIFACT_OUTPUT_DIR:-dist/os-artifact}/packages.json" \
  -output "${ARTIFACT_OUTPUT_DIR:-dist/os-artifact}/sbom.cdx.json"
'''

