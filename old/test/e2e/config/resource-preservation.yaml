apiVersion: v1
kind: Namespace
metadata:
  name: lifecycle-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preservation-config
  namespace: lifecycle-e2e
data:
  purpose: cluster-lifecycle-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: preservation-secret
  namespace: lifecycle-e2e
type: Opaque
stringData:
  marker: lifecycle-e2e
---
apiVersion: v1
kind: Service
metadata:
  name: preservation-web
  namespace: lifecycle-e2e
spec:
  selector:
    app.kubernetes.io/name: preservation-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preservation-web
  namespace: lifecycle-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preservation-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preservation-web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost@sha256:7f6bf85c9806de148307a9433fc0db7c3c3a172b53f4fdc5838862afe29c60a0
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preservation-data
  namespace: lifecycle-e2e
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: preservation-data
  ports:
    - name: placeholder
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: preservation-data
  namespace: lifecycle-e2e
spec:
  serviceName: preservation-data
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preservation-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preservation-data
    spec:
      containers:
        - name: preservation-reader
          image: registry.k8s.io/e2e-test-images/busybox@sha256:caec39cad3b12c26600baf6e67ba811ac15d28a9288d0ccdfffb4b318992c3bb
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ ! -s /data/payload.bin ]; then
                head -c 4096 /dev/urandom > /data/payload.bin
                sync
              fi
              exec sleep 2147483647
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          tart.infrastructure.cluster.x-k8s.io/preservation-reader-pod: preservation-data-0
          tart.infrastructure.cluster.x-k8s.io/preservation-payload-path: /data/payload.bin
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 64Mi
